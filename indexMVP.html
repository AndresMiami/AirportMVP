    <!-- Supabase SDK - Load First for Authentication -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <!-- config.js removed - using inline fallback configuration -->
    <script src="./supabase.js"></script>
    
    <!-- Authentication Check - Run IMMEDIATELY -->
    <script>
        // Use the supabaseClient already initialized in supabase.js
        // (Avoids duplicate declaration error with the Supabase SDK global)

        // Bookings are ACCOUNT-ONLY (account-gate PR): the session is
        // verified behind a neutral loading screen before the booking app
        // boots. A signed-in session prefills "Who's traveling" from the
        // saved profile and links the booking to the customer record.
        let currentUser = null;
        let currentSession = null;
        let currentProfile = null;
        let currentAmbassador = null;
        let currentActiveBooking = null;
        let activeBookingResumed = false;
        let pendingEditIntent = null;
        try {
            pendingEditIntent = JSON.parse(sessionStorage.getItem('lm_pending_edit_intent') || 'null');
        } catch (_) { pendingEditIntent = null; }

        // ===== ACCOUNT GATE =====
        // The booking app must not initialize for signed-out visitors —
        // including direct URL entry that bypasses the homepage. While the
        // session is checked, a neutral loading screen covers the page (the
        // address form never flashes). Outcomes:
        //   session + account truth -> overlay removed, app boots
        //   no session     -> location.replace('/login.html') (the front
        //                     door; it forwards back here after sign-in)
        //   check failed   -> honest retry screen — NEVER guest fallback
        // Legacy guest bookings and /trip links are untouched: /trip is a
        // separate page with its own UUID-capability access.
        let bootAuthReady = null; // promise<boolean>: true only with a session

        (function authGate() {
            const overlay = document.createElement('div');
            overlay.id = 'authGate';
            overlay.style.cssText = 'position:fixed;inset:0;z-index:20000;background:#1C1C1E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#8E8E93;font-size:14px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;padding:20px;';
            overlay.innerHTML = '<div style="font-size:26px;font-weight:700;background:linear-gradient(135deg,#FF9933,#FF5733);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">LinkMia</div><div id="authGateMsg">Checking your session…</div>';
            const mount = () => document.body.appendChild(overlay);
            if (document.body) { mount(); } else { document.addEventListener('DOMContentLoaded', mount); }

            const showRetry = () => {
                const msg = document.getElementById('authGateMsg');
                if (!msg) return;
                msg.textContent = "We can't verify your sign-in right now.";
                const btn = document.createElement('button');
                btn.textContent = 'Try again';
                btn.style.cssText = 'display:block;margin:16px auto 0;padding:12px 28px;border:none;border-radius:12px;background:linear-gradient(135deg,#FF9933,#FF5733);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;';
                btn.addEventListener('click', () => window.location.reload());
                msg.appendChild(btn);
            };

            bootAuthReady = (async () => {
                try {
                    if (!window.supabaseClient) throw new Error('auth client unavailable');
                    const { data: { session } } = await window.supabaseClient.auth.getSession();
                    if (!session) {
                        // replace() so Back doesn't bounce into the gate again
                        window.location.replace('/login.html');
                        return false; // overlay stays up until navigation lands
                    }
                    currentSession = session;
                    currentUser = session.user;

                    // Account continuity is part of the gate, not optional
                    // profile decoration. Until the server confirms whether
                    // this account owns a live ride, showing an empty booking
                    // form would invite an unnecessary second submission.
                    const profileResponse = await fetch('/api/profile', {
                        headers: { 'Authorization': `Bearer ${session.access_token}` }
                    });
                    if (profileResponse.status === 401) {
                        // getSession() can still return a locally unexpired
                        // token that was revoked server-side. Clear it before
                        // returning to the front door so Retry cannot loop.
                        // The session's pending envelope goes with it.
                        try { sessionStorage.removeItem('lm_pending_envelope'); } catch (_) {}
                        try { await window.supabaseClient.auth.signOut(); } catch (_) {}
                        window.location.replace('/login.html');
                        return false;
                    }
                    if (!profileResponse.ok) throw new Error('account continuity unavailable');
                    const { profile, ambassador, activeBooking } = await profileResponse.json();
                    currentProfile = profile || null;
                    currentAmbassador = ambassador || null;
                    currentActiveBooking = activeBooking || null;

                    console.log('✅ Signed in as:', session.user.email);
                    addAuthPill(true);
                    overlay.remove();
                    return true;
                } catch (e) {
                    console.error('❌ Auth gate failed:', e);
                    showRetry();
                    return false;
                }
            })();
        })();

        // Post-cancellation notice: after a confirmed cancellation the page
        // reloads to a clean Where screen; this one-time banner explains why.
        (function showCancelNotice() {
            let tripCode = null;
            try {
                tripCode = sessionStorage.getItem('lm_cancel_notice');
                if (tripCode === null) return;
                sessionStorage.removeItem('lm_cancel_notice'); // never shows twice
            } catch (e) { return; }

            const show = () => {
                const banner = document.createElement('div');
                banner.id = 'cancelNotice';
                banner.style.cssText = 'position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 10001; background: #2C2C2E; color: #fff; border: 1px solid rgba(255,69,58,0.5); border-radius: 12px; padding: 12px 18px; font-size: 14px; font-weight: 600; box-shadow: 0 4px 20px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; max-width: 92vw;';
                banner.innerHTML = `<span>🚫 Booking ${tripCode || ''} was cancelled</span><button style="background:none;border:none;color:#8E8E93;font-size:16px;cursor:pointer;padding:0 2px;" aria-label="Dismiss">✕</button>`;
                banner.querySelector('button').addEventListener('click', () => banner.remove());
                document.body.appendChild(banner);
                setTimeout(() => { banner.style.transition = 'opacity 0.5s'; banner.style.opacity = '0'; setTimeout(() => banner.remove(), 600); }, 6000);
            };
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', show);
            } else {
                show();
            }
        })();

        // Referral attribution: a ?ref=CODE visit (QR scan) is remembered for
        // 30 days and attached to bookings made from this browser.
        (function captureRefCode() {
            try {
                const ref = new URLSearchParams(location.search).get('ref');
                if (ref) {
                    localStorage.setItem('lm_ref', JSON.stringify({ code: ref, at: Date.now() }));
                }
            } catch (e) { /* non-critical */ }
        })();

        function getStoredRefCode() {
            try {
                const raw = localStorage.getItem('lm_ref');
                if (!raw) return null;
                const { code, at } = JSON.parse(raw);
                if (Date.now() - at > 30 * 24 * 60 * 60 * 1000) {
                    localStorage.removeItem('lm_ref');
                    return null;
                }
                return code;
            } catch (e) { return null; }
        }

        // The account gate resolves the server-owned booking before the app
        // boots. This single-shot guard still protects repeated init calls.
        function resumeAccountBookingWhenReady() {
            if (!window.airportApp || activeBookingResumed) return;
            const intent = pendingEditIntent;
            const clearIntent = () => {
                pendingEditIntent = null;
                try { sessionStorage.removeItem('lm_pending_edit_intent'); } catch (_) {}
            };

            // Same-tab recovery FIRST, on every boot path: an unresolved
            // submission envelope is offered back to the SAME account even
            // when a live booking resumes into the trip sheet or an edit
            // reopens — the fixed card overlays either. (A normal
            // passenger's unresolved EDIT always coexists with an active
            // booking, so gating this on "no booking resumed" made edit
            // recovery unreachable.)
            try {
                window.supabaseClient?.auth?.getSession().then(({ data }) => {
                    const subject = data?.session?.user?.id || null;
                    if (subject) window.airportApp.offerPendingEnvelope(subject);
                });
            } catch (_) { /* recovery must never break boot */ }

            const bookingId = currentActiveBooking?.id;
            if (bookingId) {
                activeBookingResumed = true;
                try { localStorage.setItem('lm_last_trip_id', bookingId); } catch (_) {}
                if (currentActiveBooking.status === 'pending' &&
                    intent?.bookingId === bookingId) {
                    const editIntent = {
                        bookingId,
                        tripCode: currentActiveBooking.trip_id || intent.tripCode || '',
                        detailsVersion: Number(currentActiveBooking.details_version) ||
                            Number(intent.detailsVersion) || 1
                    };
                    clearIntent();
                    window.airportApp.beginPendingEdit(editIntent);
                    return;
                }
                // Unmatched or non-pending intent: clear it so it can never
                // resurface confusingly in a later session.
                clearIntent();
                window.airportApp.showTripSheet(bookingId);
                return;
            }

            // Ambassadors get no profile.activeBooking (multi-ride by
            // design), but their standalone Edit ride intent must still be
            // honored — a fresh Book Service form here would invite an
            // accidental SECOND ride. The server (update-pending-booking)
            // remains the sole authority on ownership, pending status,
            // assignment, and details_version; a bad intent just 403/409s.
            if (currentAmbassador && intent &&
                /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(intent.bookingId || '')) {
                activeBookingResumed = true;
                const editIntent = {
                    bookingId: intent.bookingId,
                    tripCode: intent.tripCode || '',
                    detailsVersion: Number(intent.detailsVersion) || 1
                };
                clearIntent();
                window.airportApp.beginPendingEdit(editIntent);
                return;
            }

            // No live booking and no consumable intent: drop anything stale.
            if (intent) clearIntent();
        }

        function applyAuthenticatedAccountState() {
            if (currentAmbassador) {
                // Ambassadors book for guests only — lock "For myself",
                // never prefill their own info as the traveler.
                applyAmbassadorMode();
                showAmbassadorStamp(currentAmbassador);
                if (currentProfile) showWelcome(currentProfile);
            } else if (currentProfile) {
                applyProfilePrefill();
                showWelcome(currentProfile);
            }
        }

        // Lock "For myself" for ambassador accounts once the modal exists
        function applyAmbassadorMode() {
            const tryApply = () => {
                if (typeof PassengerModal !== 'undefined' && PassengerModal.getInstance) {
                    const modal = PassengerModal.getInstance();
                    if (modal?.setAmbassadorMode) {
                        modal.setAmbassadorMode(currentUser?.email);
                        console.log('★ Ambassador mode active');
                        return true;
                    }
                }
                return false;
            };
            if (!tryApply()) {
                const timer = setInterval(() => { if (tryApply()) clearInterval(timer); }, 300);
                setTimeout(() => clearInterval(timer), 10000);
            }
        }

        // Prefill "Who's traveling" once the modal singleton exists
        function applyProfilePrefill() {
            if (!currentProfile) return;
            const tryApply = () => {
                if (typeof PassengerModal !== 'undefined' && PassengerModal.getInstance) {
                    const modal = PassengerModal.getInstance();
                    if (modal?.prefillFromProfile) {
                        modal.prefillFromProfile(currentProfile);
                        console.log('✅ Passenger info prefilled from profile');
                        return true;
                    }
                }
                return false;
            };
            if (!tryApply()) {
                const timer = setInterval(() => { if (tryApply()) clearInterval(timer); }, 300);
                setTimeout(() => clearInterval(timer), 10000);
            }
        }

        // Gold ambassador signature — a slim in-flow chip, right-aligned at
        // the top of the booking container. Occupies its own row so it never
        // overlaps controls on any screen size, and stays visible across all
        // booking stages (it sits above the panel switcher).
        function showAmbassadorStamp(ambassador) {
            if (document.getElementById('ambassadorStamp')) return;
            const container = document.querySelector('.app-container');
            if (!container) return;

            const stampStyles = document.createElement('style');
            stampStyles.textContent = `
                #ambassadorStamp {
                    display: flex;
                    justify-content: flex-end;
                    padding: 10px 14px 0;
                }
                #ambassadorStamp .amb-chip {
                    display: inline-flex;
                    align-items: center;
                    gap: 6px;
                    padding: 5px 12px;
                    border-radius: 20px;
                    border: 1px solid rgba(212, 175, 55, 0.55);
                    background: linear-gradient(135deg, rgba(212,175,55,0.12), rgba(138,109,31,0.08));
                    box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
                    animation: ambassadorGlow 3s ease-in-out infinite;
                }
                #ambassadorStamp .amb-star {
                    font-size: 12px;
                    background: linear-gradient(135deg, #f7e27e, #d4af37);
                    -webkit-background-clip: text;
                    background-clip: text;

        async function logout() {
            // A pending submission envelope is bound to this account; it

            await window.supabaseClient.auth.signOut();
            window.location.href = '/login.html';
        }

        // Small pill bottom-right: Sign in (guests) / Sign out (members)
        function addAuthPill(signedIn) {

    <!-- Main Application Scripts -->
    <!-- Autocomplete will be loaded lazily when needed -->
    <script>
        // ========== PR 3C-2B2 — SERVER QUOTE ROLLOUT FLAG ==========
        // false  = today's behaviour, byte for byte. No quote request is ever
        //          made, and pricing.js still sets the displayed and submitted
        //          price. Merging 2B2 with this false changes nothing.
        // true   = the server quote becomes the ONLY price that may be shown as
        //          final or submitted. A missing or expired quote blocks Book.
        //
        // ROLLOUT ORDER — each step is its own authorized action, and the
        // browser flag is LAST. Doing these out of order either blocks every
        // booking or opens a paid Google endpoint before it has been smoked.
        //   1. Leave QUOTE_SERVICE_DISABLED=1 ON. Nothing below changes that.
        //   2. Restore the four provider/signing secrets on the PRODUCTION
        //      context ONLY: GOOGLE_ROUTES_API_KEY,
        //      GOOGLE_PLACES_SERVER_API_KEY, QUOTE_SIGNING_CURRENT_ID,
        //      QUOTE_SIGNING_CURRENT_SECRET. They were deliberately removed
        //      after 2B1 testing. Do NOT touch GOOGLE_MAPS_API_KEY — that is
        //      the browser/Railway autocomplete key and is unrelated.
        //   3. Set QUOTE_ACCESS_MODE=authenticated. Do NOT simply delete
        //      QUOTE_SHADOW_ALLOWLIST: in the default 'allowlist' mode a
        //      missing allowlist is a configuration error and answers 500.
        //      Access is a NAMED mode so removing one variable can never
        //      silently open a paid endpoint to everyone.
        //   4. Deploy and VERIFY the endpoint still answers 503. Netlify
        //      captures env at build time, so this proves the new config
        //      shipped without exposing anything.
        //   5. Remove QUOTE_SERVICE_DISABLED and smoke-test the endpoint
        //      directly, while this browser flag is still false.
        //   6. Only then flip this flag to true.
        // Precedent for a client-side rollout constant: REQUIRE_PAYMENT.
        const SERVER_QUOTE_ENABLED = false;

        // A quote is priced for one exact intent. Anything that changes the
        // intent must throw the old quote away rather than reprice silently.
        const QUOTE_DEBOUNCE_MS = 500;

        // Main Application Class
        class AirportBookingApp {
            constructor() {
                this.state = {
                    mode: 'dropoff',
                    locations: {
                        address: null,
                        airport: null,
                        placeId: null   // autocomplete's Google place_id (PR 3C-2B2)
                    },
                    route: {
                        distance: null,
                        duration: null,
                        price: null
                    },
                    dateTime: {
                        date: new Date(),
                        time: null
                    },
                    // PR 3C-2B2 — the server quote is the ONLY price that may be
                    // displayed as final or submitted. pricing.js runs alongside
                    // it as a silent shadow and can never reach the passenger or
                    // the database. See SERVER_QUOTE_ENABLED below.
                    quote: {
                        status: 'idle',   // idle | loading | ready | error | blocked
                        key: null,        // the intent tuple this quote answers
                        data: null,       // the server's quote object, verbatim
                        error: null,      // { message, retryable }
                        seq: 0            // guards against a stale response landing
                    },
                    flight: '',
                    vehicle: {
                        selected: null,
                        pricing: null
                    },
                    passengers: 1,
                    guestData: null,
                    pickupNotes: null,
                    paymentMethod: 'visa-1187',
                    promoCode: null,
                    ui: {
                        currentPanel: 'where'
                    }
                };
                
                this.els = {};
                this.autocomplete = null;
                this.vehicleMap = null;
                this.directionsRenderer = null;
                this.pricingService = null;
                this.pendingEdit = null;
                
                this.init();
            }
            
            init() {
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', () => this.setup());
                } else {
                    this.setup();
                }
                
                this.initializePricingService();
            }
            
            async initializePricingService() {
                try {
                    console.log('🔄 Loading pricing service...');
                    const pricingModule = await import('./pricing.js');
                    this.pricingService = pricingModule.pricingService;
                    
                    if (!this.pricingService) {
                        throw new Error('pricingService not found in module exports');
                    }
                    
                    this.vehicleConfig = this.pricingService.getAllVehicleConfigs();
                    console.log('✅ Pricing service loaded successfully');
                    console.log('📊 Vehicle configurations:', this.vehicleConfig);
                    
                    // Test psychological pricing to verify it's working
                    const testPrice = this.pricingService.applyPsychologicalPricing(234.67);
                    console.log('💰 Psychological pricing test: $234.67 → $' + testPrice);
                    
                    // Validate configuration
                    const validation = this.pricingService.validateConfiguration();
                    if (!validation.valid) {
                        console.warn('⚠️ Pricing configuration issues:', validation.issues);
                    }
                    
                } catch (error) {
                    console.error('❌ Failed to load pricing service:', error);
                    console.log('🔄 Using default vehicle configuration');
                    
                    // Import default configuration from config.js
                    try {
                        const configModule = await import('./config.js');
                        this.vehicleConfig = configModule.DEFAULT_VEHICLE_CONFIG;
                        console.log('✅ Default vehicle configuration loaded');
                    } catch (configError) {
                        console.error('❌ Failed to load config file, using hardcoded fallback');
                        // Ultimate fallback if config.js can't be loaded
                        this.vehicleConfig = {
                            tesla: { 
                                name: 'Tesla Model Y',
                                basePrice: 125,
                                capacity: { passengers: 4, bags: 4 } 
                            },
                            escalade: { 
                                name: 'Cadillac Escalade',
                                basePrice: 169,
                                capacity: { passengers: 7, bags: 8 } 
                            },
                            sprinter: { 
                                name: 'Mercedes Sprinter',
                                basePrice: 219,
                                capacity: { passengers: 12, bags: 15 } 
                            }
                        };
                    }
                    
                    this.pricingService = null;
                }
            }
            
            setup() {
                console.log('🔄 Setting up AirportBookingApp...');
                this.cacheElements();
                this.bindEvents();
                this.initializeDateTime();
                console.log('✅ AirportBookingApp setup complete');

                // Auto-start booking if coming from landing page or PWA
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('book') === '1') {
                    this.startBooking();
                }
            }
            
            cacheElements() {
                const elementIds = [
                    'startSearchBtn', 'bookingContainer', 'panelsWrapper', 'progressLine', 'progressLine2',
                    'summaryBar', 'addressInput', 'addressLoading', 'autocompleteDropdown',
                    'addressStep', 'airportStep', 
                    'airportBadge', 'airportTitle', 'flowConnector',
                    'hourSelect', 'minuteSelect', 'ampmSelect', 'timeNote', 'continueBtn',
                    'backBtn', 'summaryBackBtn', 'bookBtn', 'editRouteBtn', 'routeSummaryText',
                    'flightInput', 'flightSection', 'arrivalTitle', 'tripDuration',
                    'todayBtn', 'tomorrowBtn', 'otherDatesBtn', 'todayDate', 'tomorrowDate',
                    'calendarContainer', 'calendarMonthYear', 'calendarGrid', 'prevMonthBtn', 'nextMonthBtn',
                    'vehicleSelectionBtn', 'vehicleBackBtn', 'vehiclePanel', 'vehicleMap',
                    'mapArrivalTime', 'mapPickupTime', 'mapLocationText'
                ];
                
                let foundElements = 0;
                elementIds.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        this.els[id] = el;
                        foundElements++;
                    } else {
                        console.warn(`Element not found: ${id}`);
                    }
                });
                
                this.els.modeBtns = document.querySelectorAll('.mode-btn');
                this.els.airportOptions = document.querySelectorAll('.airport-option');
                this.els.progressSteps = document.querySelectorAll('.progress-step');
                this.els.dateBtns = document.querySelectorAll('.date-btn');
                // this.els.vehicleCards = document.querySelectorAll('.vehicle-card'); // Now in iframe
                
                debug.info(`Cached ${foundElements}/${elementIds.length} elements`);
                debug.info(`Found ${this.els.modeBtns.length} mode buttons, ${this.els.airportOptions.length} airport options`);
            }
            
            async initializeAutocomplete(retryCount = 0) {
                const MAX_RETRIES = 5;
                const RETRY_DELAY = 500; // ms

                try {
                    // Check if required elements exist
                    if (!this.els.addressInput) {
                        debug.warn('Cannot initialize autocomplete: addressInput element not found');
                        return;
                    }
                    if (!this.els.autocompleteDropdown) {
                        debug.warn('Cannot initialize autocomplete: autocompleteDropdown element not found');
                        return;
                    }

                    // Wait for Google Maps to load with retry mechanism
                    if (typeof google === 'undefined' || !google.maps) {
                        if (retryCount < MAX_RETRIES) {
                            console.log(`⏳ Google Maps not ready, retrying in ${RETRY_DELAY}ms (attempt ${retryCount + 1}/${MAX_RETRIES})`);
                            if (this.els.addressInput) {
                                this.els.addressInput.placeholder = 'Loading maps...';
                            }
                            await new Promise(resolve => setTimeout(resolve, RETRY_DELAY));
                            return this.initializeAutocomplete(retryCount + 1);
                        }
                        throw new Error('Google Maps not loaded after retries');
                    }
                    
                    // Show loading state
                    if (this.els.addressInput) {
                        this.els.addressInput.placeholder = 'Loading address search...';
                    }
                    
                    const [placesLib, autocompleteModule] = await Promise.all([
                        google.maps.importLibrary("places"),
                        import('./autocomplete.js')
                    ]);
                    
                    const { CustomAutocomplete } = autocompleteModule;
                    
                    this.autocomplete = new CustomAutocomplete(
                            this.els.addressInput, 
                            this.els.autocompleteDropdown,
                            (locationData) => {
                                this.handleAddressSelected({
                                    placeId: locationData.place?.id || 'unknown',
                                    description: locationData.address
                                });
                                
                                const coords = locationData.coordinates || { lat: 25.7617, lng: -80.1918 };
                                this.handleAddressCoordinates({
                                    lat: coords.lat,
                                    lng: coords.lng,
                                    address: locationData.address
                                });
                            }
                        );
                        
                        // Add event listeners with safety checks
                        if (this.els.addressInput) {
                            this.els.addressInput.addEventListener('place-selected', (e) => {
                                this.handleAddressSelected(e.detail);
                            });
                            
                            this.els.addressInput.addEventListener('place-coordinates', (e) => {
                                this.handleAddressCoordinates(e.detail);
                            });
                            
                            this.els.addressInput.addEventListener('validation-cleared', () => {
                                this.handleAddressValidationCleared();
                            });
                        }
                        
                    
                    // Restore placeholder
                    if (this.els.addressInput) {
                        this.els.addressInput.placeholder = 'Enter pickup address, hotel, or landmark...';
                    }
                    
                    debug.success('Autocomplete initialized with lazy loading');
                    
                } catch (error) {
                    errorHandler.handleError({
                        message: 'Failed to initialize address search',
                        error,
                        context: 'autocomplete',
                        userMessage: 'Address search is temporarily unavailable. You can still type your address manually.'
                    });
                    
                    // Restore placeholder
                    if (this.els.addressInput) {
                        this.els.addressInput.placeholder = 'Enter pickup address, hotel, or landmark...';
                    }
                }
            }
            
            bindEvents() {
                // Lazy load autocomplete on first interaction (with retry support)
                this.els.addressInput?.addEventListener('focus', async () => {
                    if (!this.autocomplete) {
                        await this.initializeAutocomplete();
                    }
                });
                
                this.els.startSearchBtn?.addEventListener('click', () => this.startBooking());
                
                this.els.modeBtns.forEach(btn => {
                    btn.addEventListener('click', () => this.setMode(btn.dataset.mode));
                });
                
                this.els.airportOptions.forEach(option => {
                    option.addEventListener('click', () => this.selectAirport(option.dataset.airport));
                });
                
                this.els.continueBtn?.addEventListener('click', () => this.navigateToPanel('when'));
                this.els.backBtn?.addEventListener('click', () => this.navigateToPanel('where'));
                this.els.summaryBackBtn?.addEventListener('click', () => this.goBackFromSummary());
                this.els.vehicleSelectionBtn?.addEventListener('click', () => this.navigateToPanel('vehicle'));
                this.els.vehicleBackBtn?.addEventListener('click', () => this.navigateToPanel('when'));
                this.els.bookBtn?.addEventListener('click', () => this.handleBookingClick());
                this.els.editRouteBtn?.addEventListener('click', () => this.navigateToPanel('where'));
                
                // Vehicle card clicks now handled via iframe postMessage
                
                this.els.flightInput?.addEventListener('input', (e) => {
                    this.state.flight = e.target.value;
                });
            }
            
            startBooking() {
                try {
                    debug.log('Starting booking flow');
                    
                    if (!this.els.startSearchBtn) {
                        console.error('Start button not found');
                        return;
                    }
                    
                    if (!this.els.bookingContainer) {
                        console.error('Booking container not found');
                        return;
                    }
                    
                    this.els.startSearchBtn.style.display = 'none';
                    this.els.bookingContainer.classList.add('active');
                    
                    setTimeout(() => {
                        if (this.state.mode === 'dropoff') {
                            this.els.addressInput?.focus();
                        }
                    }, 300);
                } catch (error) {
                    console.error('Error starting booking:', error);
                }
            }
            
            setMode(mode) {
                this.state.mode = mode;
                
                this.els.modeBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === mode);
                });
                
                this.updateStepOrder(mode === 'dropoff');
                this.resetSelections();
            }
            
            updateStepOrder(isDropoff) {
                this.els.addressStep.style.order = isDropoff ? '1' : '3';
                this.els.flowConnector.style.order = '2';
                this.els.airportStep.style.order = isDropoff ? '3' : '1';
                
                // Badge numbers removed for space optimization
                // Update airport title only
                if (this.els.addressTitle) {
                    this.els.addressTitle.textContent = isDropoff ? 'Pickup Location' : 'Destination Address';
                }
                this.els.airportTitle.textContent = isDropoff ? 'Destination Airport' : 'Pickup Airport';
                
                if (isDropoff) {
                    this.els.addressInput.disabled = false;
                    this.els.addressStep.classList.remove('disabled');
                } else {
                    const shouldDisableAddress = !this.state.locations.airport;
                    this.els.addressInput.disabled = shouldDisableAddress;
                    this.els.addressStep.classList.toggle('disabled', shouldDisableAddress);
                }
                
                this.updateAirportStepState();
                
                this.els.flightSection.style.display = this.state.mode === 'pickup' ? 'block' : 'none';
            }
            
            updateAirportStepState() {
                const shouldDisableAirport = this.state.mode === 'dropoff' && !this.state.locations.address;
                this.els.airportStep.classList.toggle('disabled', shouldDisableAirport);
                
                this.els.airportOptions.forEach(option => {
                    option.disabled = shouldDisableAirport;
                });
            }
            
            resetSelections() {
                this.state.locations = { address: null, airport: null, placeId: null };
                this.state.route = { distance: null, duration: null, price: null };
                this.invalidateQuote('selection reset');
                
                this.els.addressInput.value = '';
                if (this.autocomplete) {
                    this.autocomplete.clearValidation();
                }
                
                this.els.airportOptions.forEach(opt => opt.classList.remove('selected'));
                // Address badge removed for space optimization
                this.els.airportBadge.classList.remove('completed', 'active');
                this.els.flowConnector.classList.remove('active');
                
                this.updateStepOrder(this.state.mode === 'dropoff');
                
                this.updateContinueButton();
            }
            
            handleAddressSelected(detail) {
                // PR 3C-2B2: keep autocomplete's place_id. Before this it was
                // received here and thrown away, which is why
                // `state.locations.address.place_id` was read at the pricing
                // call site and was always undefined. The server quote needs a
                // real place_id, and 2C will need the CANONICAL one the server
                // returns (stored separately in state.quote.data.intent).
                const placeId = detail && detail.placeId;
                this.state.locations.placeId =
                    (typeof placeId === 'string' && placeId && placeId !== 'unknown')
                        ? placeId
                        : null;
                // Edit-session interaction marker: only a LIVE autocomplete
                // selection in this session counts — retained text never does.
                // quoteFlowActive() keeps every flag-off legacy path untouched.
                if (this.pendingEdit && this.editMarkers && this.quoteFlowActive() &&
                    this.state.locations.placeId) {
                    this.editMarkers.routeAddress = true;
                    this.updateBookAvailability();
                }

                this.updateAddressStepState();
                this.updateAirportStepState();
                this.updateContinueButton();
            }

            handleAddressCoordinates(detail) {
                this.state.locations.address = {
                    address: detail.address,
                    coordinates: { lat: detail.lat, lng: detail.lng }
                };

                this.invalidateQuote('address changed');
                this.updateAddressStepState();
                this.calculateRoute();
            }

            handleAddressValidationCleared() {
                this.state.locations.address = null;
                this.state.locations.placeId = null;
                this.invalidateQuote('address cleared');
                this.updateAddressStepState();
                this.updateAirportStepState();
                this.updateContinueButton();
            }
            
            updateAddressStepState() {
                const isValidated = this.autocomplete?.isValidated && this.state.locations.address;
                // Address badge removed for space optimization
                
                this.els.airportBadge.classList.toggle('active', isValidated);
                
                if (isValidated) {
                    this.els.flowConnector.classList.add('active');
                } else {
                    this.els.flowConnector.classList.remove('active');
                    this.els.airportBadge.classList.remove('active');
                }
            }
            
            selectAirport(airportCode) {
                if (this.state.mode === 'dropoff' && !this.state.locations.address) {
                    return;
                }
                
                this.state.locations.airport = {
                    code: airportCode,
                    name: this.getAirportName(airportCode)
                };
                this.invalidateQuote('airport changed');
                if (this.pendingEdit && this.editMarkers && this.quoteFlowActive()) {
                    this.editMarkers.routeDirection = true;
                    this.updateBookAvailability();
                }

                this.els.airportOptions.forEach(opt => {
                    opt.classList.toggle('selected', opt.dataset.airport === airportCode);
                });
                
                this.els.airportBadge.classList.remove('active');
                this.els.airportBadge.classList.add('completed');
                
                if (this.state.mode === 'pickup') {
                    this.els.addressInput.disabled = false;
                    this.els.addressStep.classList.remove('disabled');
                    setTimeout(() => {
                        this.els.addressInput?.focus();
                    }, 100);
                }
                
                this.updateContinueButton();
                this.calculateRoute();
            }
            
            getAirportName(code) {
                const names = {
                    'MIA': 'Miami International',
                    'FLL': 'Fort Lauderdale',
                    'PBI': 'Palm Beach'
                };
                return names[code] || code;
            }
            
            async calculateRoute() {
                if (!this.state.locations.address || !this.state.locations.airport) return;
                
                try {
                    const routeData = await this.getRouteData(
                        this.state.locations.address.coordinates,
                        this.state.locations.airport.code
                    );
                    
                    if (routeData) {
                        this.state.route = routeData;
                        
                        // Update vehicle prices once route data is available
                        console.log('📍 Route calculated, updating vehicle prices...');
                        this.updateVehiclePrices();
                    }
                    
                    this.updateRouteDisplay();
                    
                } catch (error) {
                    console.error('Route calculation error:', error);
                }
            }
            
            async getRouteData(addressCoords, airportCode) {
                try {
                    const airportCoords = this.getAirportCoordinates(airportCode);
                    if (!airportCoords) {
                        return null;
                    }
                    
                    const addressString = this.state.locations.address?.address;
                    if (!addressString) {
                        return null;
                    }
                    
                    let origin, destination;
                    
                    if (this.state.mode === 'dropoff') {
                        origin = addressString;
                        destination = `${airportCoords.lat},${airportCoords.lng}`;
                    } else {
                        origin = `${airportCoords.lat},${airportCoords.lng}`;
                        destination = addressString;
                    }
                    
                    // Use Railway proxy for directions
                    const directionsUrl = 'https://reliable-warmth-production-d382.up.railway.app/api/directions';
                    const response = await fetch(directionsUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            origin: origin,
                            destination: destination,
                            mode: 'driving',
                            units: 'imperial',
                            departure_time: 'now',
                            traffic_model: 'best_guess'
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to fetch directions');
                    }

                    const result = await response.json();
                    
                    if (result.status !== 'OK' || !result.route) {
                        throw new Error(`Directions service failed: ${result.status}`);
                    }
                    
                    const route = result.route;
                    
                    const distanceInMiles = route.distance.value * 0.000621371;
                    
                    let durationInMinutes;
                    if (route.duration_in_traffic) {
                        durationInMinutes = Math.round(route.duration_in_traffic.value / 60);
                    } else {
                        durationInMinutes = Math.round(route.duration.value / 60);
                    }
                    
                    return {
                        distance: Math.round(distanceInMiles * 10) / 10,
                        duration: durationInMinutes,
                        price: null,
                        realData: true
                    };
                    
                } catch (error) {
                    console.error('Error getting route data:', error);
                    return null;
                }
            }
            
            getAirportCoordinates(airportCode) {
                const airportCoords = {
                    'MIA': { lat: 25.7931, lng: -80.2906 },
                    'FLL': { lat: 26.0742, lng: -80.1506 },
                    'PBI': { lat: 26.6832, lng: -80.0956 }
                };
                return airportCoords[airportCode];
            }
            
            formatDuration(minutes) {
                if (minutes < 60) {
                    return `${minutes} min`;
                } else {
                    const hours = Math.floor(minutes / 60);
                    const remainingMinutes = minutes % 60;
                    if (remainingMinutes === 0) {
                        return `${hours} hr`;
                    } else {
                        return `${hours} hr ${remainingMinutes} min`;
                    }
                }
            }
            
            updateRouteDisplay() {
                const now = new Date();
                const arrivalTime = new Date(now.getTime() + this.state.route.duration * 60 * 1000);
                const formattedArrivalTime = arrivalTime.toLocaleTimeString('en-US', {
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });
                
                const formattedDuration = this.formatDuration(this.state.route.duration);
                
                const actionText = this.state.mode === 'dropoff' ? 'Drop-off' : 'Drop off';
                const locationText = this.state.mode === 'dropoff' ? 'airport' : 'destination';
                
                this.els.arrivalTitle.textContent = `${actionText} at ${locationText} approx. ${formattedArrivalTime}`;
                this.els.tripDuration.textContent = `Estimated ride duration of ${formattedDuration}`;
                
                if (this.state.route.realData) {
                    this.els.tripDuration.textContent += ' (live data)';
                } else {
                    this.els.tripDuration.textContent += ' (estimated)';
                }
            }
            
            canContinue() {
                return this.state.locations.address && this.state.locations.airport;
            }
            
            updateContinueButton() {
                const enabled = this.canContinue();
                this.els.continueBtn.disabled = !enabled;
            }
            
            navigateToPanel(panel) {
                if (panel === 'when' && !this.canContinue()) return;
                if (panel === 'vehicle' && !this.canContinue()) return;
                
                this.els.panelsWrapper.classList.remove('show-when', 'show-vehicle');
                this.els.progressLine.classList.remove('active');
                this.els.summaryBar.classList.remove('visible');
                
                if (panel === 'when') {
                    this.els.panelsWrapper.classList.add('show-when');
                    this.els.progressLine.classList.add('active');
                    this.els.summaryBar.classList.add('visible');
                    this.updateProgressSteps('when');
                    this.updateSummary();
                } else if (panel === 'vehicle') {
                    this.els.panelsWrapper.classList.add('show-vehicle');
                    this.els.progressLine.classList.add('active');
                    this.els.summaryBar.classList.add('visible');
                    this.updateVehiclePrices();
                    this.updateProgressSteps('vehicle');
                    this.updateSummary();
                    this.updateVehicleMap();
                    this.updateMapBadges();
                    // Image preloading now handled by iframe carousel
                } else {
                    this.updateProgressSteps('where');
                }
                
                this.state.ui.currentPanel = panel;

                // Requested only once the passenger is actually on the Vehicle
                // step, and only after currentPanel is set so scheduleQuote's
                // stage gate agrees with this call.
                if (panel === 'vehicle' && this.quoteFlowActive()) this.requestServerQuote();
            }
            
            goBackFromSummary() {
                // Determine which panel to go back to based on current state
                if (this.state.ui.currentPanel === 'vehicle') {
                    this.navigateToPanel('when');
                } else if (this.state.ui.currentPanel === 'when') {
                    this.navigateToPanel('where');
                } else {
                    // Default fallback
                    this.navigateToPanel('where');
                }
            }
            
            updateProgressSteps(activeStep) {
                this.els.progressSteps.forEach(step => {
                    const stepName = step.dataset.step;
                    step.classList.toggle('active', stepName === activeStep);
                    step.classList.toggle('completed', 
                        (activeStep === 'when' && stepName === 'where') ||
                        (activeStep === 'vehicle' && (stepName === 'where' || stepName === 'when')));
                });
                
                // Update progress lines
                if (this.els.progressLine) {
                    this.els.progressLine.classList.toggle('active', 
                        activeStep === 'when' || activeStep === 'vehicle');
                }
                if (this.els.progressLine2) {
                    this.els.progressLine2.classList.toggle('active', 
                        activeStep === 'vehicle');
                }
            }
            
            updateSummary() {
                if (this.state.locations.address && this.state.locations.airport) {
                    const from = this.state.mode === 'dropoff' 
                        ? this.truncateText(this.state.locations.address.address) 
                        : this.state.locations.airport.code;
                    const to = this.state.mode === 'dropoff' 
                        ? this.state.locations.airport.code 
                        : this.state.locations.address.address;
                    
                    this.els.routeSummaryText.textContent = `${from} → ${to}`;
                }
            }
            
            updateMapBadges() {
                if (this.state.dateTime.time) {
                    const pickupTime = new Date(this.state.dateTime.time);
                    const arrivalTime = new Date(pickupTime.getTime() + (this.state.route.duration || 45) * 60 * 1000);
                    
                    const formatTime = (date) => {
                        const hours = date.getHours();
                        const minutes = date.getMinutes();
                        const isPM = hours >= 12;
                        const displayHours = hours > 12 ? hours - 12 : (hours === 0 ? 12 : hours);
                        return `${displayHours}:${minutes.toString().padStart(2, '0')}`;
                    };
                    
                    this.els.mapPickupTime.textContent = formatTime(pickupTime);
                    this.els.mapArrivalTime.textContent = formatTime(arrivalTime);
                }
                
                if (this.state.locations.airport) {
                    // Show airport code instead of full name for compact display
                    const airportCode = this.state.locations.airport.code.toUpperCase();
                    this.els.mapLocationText.textContent = `📍 ${airportCode}`;
                }
            }
            
            truncateText(text, maxLength = 25) {
                const firstPart = text.split(',')[0];
                return firstPart.length > maxLength 
                    ? firstPart.substring(0, maxLength) + '...' 
                    : firstPart;
            }
            
            initializeDateTime() {
                this.initializeDateSelection();
                this.populateTimeOptions();
                this.setDefaultDateTime();
            }
            
            initializeDateSelection() {
                const today = new Date();
                const tomorrow = new Date(today);
                tomorrow.setDate(today.getDate() + 1);
                
                document.getElementById('todayDate').textContent = this.formatDateShort(today);
                document.getElementById('tomorrowDate').textContent = this.formatDateShort(tomorrow);
                
                document.getElementById('todayBtn').dataset.date = today.toISOString();
                document.getElementById('tomorrowBtn').dataset.date = tomorrow.toISOString();
                
                document.getElementById('todayBtn').addEventListener('click', () => this.selectDateByType('today'));
                document.getElementById('tomorrowBtn').addEventListener('click', () => this.selectDateByType('tomorrow'));
                document.getElementById('otherDatesBtn').addEventListener('click', () => this.selectDateByType('other'));
            }
            
            formatDateShort(date) {
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                               'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                return `${months[date.getMonth()]} ${date.getDate()}`;
            }
            
            populateTimeOptions() {
                for (let i = 1; i <= 12; i++) {
                    this.els.hourSelect.innerHTML += `<option value="${i}">${i}</option>`;
                }
                
                for (let i = 0; i < 60; i += 15) {
                    this.els.minuteSelect.innerHTML += `<option value="${i}">${i.toString().padStart(2, '0')}</option>`;
                }
                
                ['hourSelect', 'minuteSelect', 'ampmSelect'].forEach(id => {
                    this.els[id]?.addEventListener('change', () => this.updateDateTime());
                });
            }
            
            setDefaultDateTime() {
                const now = new Date();
                let hours = now.getHours();
                let minutes = Math.ceil(now.getMinutes() / 15) * 15;
                
                if (minutes === 60) {
                    minutes = 0;
                    hours += 1;
                }
                
                const ampm = hours >= 12 ? 'PM' : 'AM';
                let displayHours = hours;
                
                if (hours > 12) displayHours -= 12;
                if (hours === 0) displayHours = 12;
                
                this.els.hourSelect.value = displayHours;
                this.els.minuteSelect.value = minutes;
                this.els.ampmSelect.value = ampm;
                
                this.state.dateTime.date = now;
                this.updateDateTime();
            }
            
            selectDateByType(type) {
                document.querySelectorAll('.date-btn').forEach(btn => btn.classList.remove('active'));
                
                this.els.calendarContainer.classList.remove('visible');
                
                if (type === 'today') {
                    const todayBtn = document.getElementById('todayBtn');
                    todayBtn.classList.add('active');
                    this.state.dateTime.date = new Date(todayBtn.dataset.date);
                    this.updateDateTime();
                } else if (type === 'tomorrow') {
                    const tomorrowBtn = document.getElementById('tomorrowBtn');
                    tomorrowBtn.classList.add('active');
                    this.state.dateTime.date = new Date(tomorrowBtn.dataset.date);
                    this.updateDateTime();
                } else if (type === 'other') {
                    document.getElementById('otherDatesBtn').classList.add('active');
                    this.els.calendarContainer.classList.add('visible');
                    this.initializeCalendar();
                    return;
                }
            }
            
            initializeCalendar() {
                this.calendarState = {
                    viewMonth: this.state.dateTime.date.getMonth(),
                    viewYear: this.state.dateTime.date.getFullYear(),
                    selectedDate: this.state.dateTime.date
                };
                
                this.renderCalendar();
                
                this.els.prevMonthBtn.addEventListener('click', () => this.navigateMonth(-1));
                this.els.nextMonthBtn.addEventListener('click', () => this.navigateMonth(1));
            }
            
            navigateMonth(delta) {
                this.calendarState.viewMonth += delta;
                
                if (this.calendarState.viewMonth > 11) {
                    this.calendarState.viewMonth = 0;
                    this.calendarState.viewYear++;
                } else if (this.calendarState.viewMonth < 0) {
                    this.calendarState.viewMonth = 11;
                    this.calendarState.viewYear--;
                }
                
                this.renderCalendar();
            }
            
            renderCalendar() {
                const { viewMonth, viewYear, selectedDate } = this.calendarState;
                
                const months = ['January', 'February', 'March', 'April', 'May', 'June', 
                              'July', 'August', 'September', 'October', 'November', 'December'];
                this.els.calendarMonthYear.textContent = `${months[viewMonth]} ${viewYear}`;
                
                const firstDay = new Date(viewYear, viewMonth, 1).getDay();
                const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
                
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                let calendarHTML = '';
                
                const days = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
                days.forEach(day => {
                    calendarHTML += `<div class="calendar-day-header">${day}</div>`;
                });
                
                for (let i = 0; i < firstDay; i++) {
                    calendarHTML += '<div></div>';
                }
                
                for (let day = 1; day <= daysInMonth; day++) {
                    const date = new Date(viewYear, viewMonth, day);
                    date.setHours(0, 0, 0, 0);
                    
                    const isPast = date < today;
                    const isToday = date.getTime() === today.getTime();
                    const isSelected = date.getDate() === selectedDate.getDate() && 
                           date.getMonth() === selectedDate.getMonth() && 
                           date.getFullYear() === selectedDate.getFullYear();
        
                    const classes = [
                        'calendar-day',
                        isPast ? 'disabled' : '',
                        isToday ? 'today' : '',
                        isSelected ? 'selected' : ''
                    ].filter(Boolean).join(' ');
                    
                    calendarHTML += `
                        <button 
                            class="${classes}" 
                            data-date="${date.toISOString()}"
                            ${isPast ? 'disabled' : ''}
                        >${day}</button>
                    `;
                }
                
                this.els.calendarGrid.innerHTML = calendarHTML;
                
                this.els.calendarGrid.querySelectorAll('.calendar-day:not(.disabled)').forEach(dayEl => {
                    dayEl.addEventListener('click', () => this.selectCalendarDate(dayEl));
                });
            }
            
            selectCalendarDate(dayEl) {
                const selectedDate = new Date(dayEl.dataset.date);
                this.calendarState.selectedDate = selectedDate;
                
                this.state.dateTime.date = selectedDate;
                
                this.els.calendarContainer.classList.remove('visible');
                
                document.querySelectorAll('.date-btn').forEach(btn => btn.classList.remove('active'));
                this.els.otherDatesBtn.classList.add('active');
                
                const dateValue = this.els.otherDatesBtn.querySelector('.date-value');
                dateValue.textContent = this.formatDateShort(selectedDate);
                
                this.els.otherDatesBtn.dataset.date = selectedDate.toISOString();
                
                this.updateDateTime();
            }
            
            updateDateTime() {
                const hours = parseInt(this.els.hourSelect.value);
                const minutes = parseInt(this.els.minuteSelect.value);
                const ampm = this.els.ampmSelect.value;
                
                const date = new Date(this.state.dateTime.date);
                let hour24 = hours;
                
                if (ampm === 'PM' && hours !== 12) hour24 += 12;
                if (ampm === 'AM' && hours === 12) hour24 = 0;
                
                date.setHours(hour24, minutes, 0, 0);
                
                const now = new Date();
                const isToday = date.toDateString() === now.toDateString();
                
                if (isToday && date < now) {
                    this.showTimeWarning();
                    
                    const minTime = new Date(now.getTime() + 30 * 60000);
                    const roundedMinutes = Math.ceil(minTime.getMinutes() / 15) * 15;
                    minTime.setMinutes(roundedMinutes);
                    
                    let minHours = minTime.getHours();
                    const minAmPm = minHours >= 12 ? 'PM' : 'AM';
                    if (minHours > 12) minHours -= 12;
                    if (minHours === 0) minHours = 12;
                    
                    this.els.hourSelect.value = minHours;
                    this.els.minuteSelect.value = minTime.getMinutes();
                    this.els.ampmSelect.value = minAmPm;
                    
                    date.setHours(minTime.getHours(), minTime.getMinutes(), 0, 0);
                } else {
                    this.hideTimeWarning();
                }
                
                const prevPickup = this.state.dateTime.time
                    ? new Date(this.state.dateTime.time).getTime() : null;
                this.state.dateTime.time = date;
                if (prevPickup !== date.getTime()) this.invalidateQuote('pickup time changed');
                if (this.pendingEdit && this.editMarkers && this.quoteFlowActive()) {
                    this.editMarkers.pickupAt = true;
                    this.updateBookAvailability();
                }
                this.updateTimeNote();
                // Time-of-day affects surge pricing. Recalculate the
                // selected vehicle before either a new booking or an edit is
                // submitted so the displayed and stored prices stay aligned.
                if (this.state.route.distance && this.state.route.duration) {
                    this.updateVehiclePrices();
                }
                this.updateBookButton();
            }

            showTimeWarning() {
                let warning = document.getElementById('timeWarning');
                if (!warning) {
                    warning = document.createElement('div');
                    warning.id = 'timeWarning';
                    warning.className = 'time-warning';
                    warning.innerHTML = `
                        <span class="warning-icon">⚠️</span>
                        <span>Please select a time at least 30 minutes from now</span>
                    `;
                    this.els.timeNote.parentElement.insertBefore(warning, this.els.timeNote);
                }
                warning.classList.add('visible');
            }

            hideTimeWarning() {
                const warning = document.getElementById('timeWarning');
                if (warning) {
                    warning.classList.remove('visible');
                }
            }

            updateBookButton() {
                if (this.state.dateTime.time && this.els.bookBtn) {
                    const dateStr = this.state.dateTime.time.toLocaleDateString('en-US', {
                        weekday: 'short',
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric'
                    });
                    const timeStr = this.state.dateTime.time.toLocaleTimeString('en-US', {
                        hour: 'numeric',
                        minute: '2-digit',
                        hour12: true
                    });
                    
                    const bookBtnSubText = this.els.bookBtn.querySelector('.btn-sub-text');
                    if (bookBtnSubText) {
                        bookBtnSubText.textContent = `${dateStr} · ${timeStr}`;
                    }
                }
            }
            
            updateTimeNote() {
                if (!this.state.dateTime.time || !this.state.route.duration) return;
                
                const pickupTime = new Date(this.state.dateTime.time);
                const arrivalTime = new Date(pickupTime.getTime() + this.state.route.duration * 60 * 1000);
                
                const formatTime = (date) => date.toLocaleTimeString('en-US', {
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });
                
                if (this.state.mode === 'dropoff') {
                    this.els.timeNote.innerHTML = `
                        <span>Pickup: <strong>${formatTime(pickupTime)}</strong></span>
                        <span>→</span>
                        <span>Airport arrival: <strong>${formatTime(arrivalTime)}</strong></span>
                    `;
                } else {
                    this.els.timeNote.innerHTML = `
                        <span>Airport pickup: <strong>${formatTime(pickupTime)}</strong></span>
                        <span>→</span>
                        <span>Destination arrival: <strong>${formatTime(arrivalTime)}</strong></span>
                    `;
                }
            }
            
            selectVehicle(vehicleData) {
                // Accept either string (legacy) or object (from carousel)
                const isObject = typeof vehicleData === 'object';
                const vehicleType = isObject ? vehicleData.id : vehicleData;

                // Use data from carousel if available, otherwise get from pricing service
                let vehicleName, passengers, bags, carouselPrice;

                if (isObject) {
                    // Data from carousel - already has correct values from pricing.js
                    vehicleName = vehicleData.name;
                    passengers = vehicleData.passengers;
                    bags = vehicleData.bags;
                    carouselPrice = vehicleData.price; // The displayed price from carousel
                } else {
                    // Fallback: get from pricing service
                    const config = this.pricingService?.getVehicleConfig(vehicleType);
                    vehicleName = config?.name || vehicleType;
                    passengers = config?.capacity?.passengers || 4;
                    bags = config?.capacity?.bags || 4;
                    carouselPrice = null;
                }

                // Set vehicle state with capacity data
                this.state.vehicle = {
                    selected: vehicleType,
                    type: vehicleType,
                    name: vehicleName,
                    passengers: passengers,
                    bags: bags,
                    price: carouselPrice // Use carousel price as initial value
                };
                // Marker only under the quote flow (flag-off legacy behavior
                // stays byte-identical), and only for the passenger's OWN
                // action: the carousel stamps userInitiated=false on its
                // boot-time auto-select, host-driven restore, and
                // unavailable-advance selections. Absence of the flag (a
                // stale cached carousel) counts as user — fail-open here is
                // dark-phase-only and self-heals with the SW bump.
                if (this.pendingEdit && this.editMarkers && this.quoteFlowActive() &&
                    !(isObject && vehicleData.userInitiated === false)) {
                    this.editMarkers.vehicle = true;
                    this.updateBookAvailability();
                }

                // PR 3C-2B2: each vehicle carries its OWN signed token in the
                // same quote, so switching vehicles selects a different token
                // rather than needing a fresh quote. The submitted price and the
                // token therefore always describe the same vehicle.
                if (this.quoteFlowActive()) {
                    const q = this.selectedQuoteVehicle();
                    if (q) {
                        this.state.vehicle.price = q.finalCents / 100;
                        this.state.vehicle.quoteToken = q.token;
                        this.state.route.price = q.finalCents / 100;
                    } else {
                        this.state.vehicle.quoteToken = null;
                    }
                    this.renderQuoteState();
                    this.updateSummary();
                    return;
                }

                // Calculate pricing if route data is available
                if (this.state.route.distance && this.state.route.duration) {
                    const pricing = this.calculateVehiclePrice(vehicleType, this.state.route.distance, this.state.route.duration);

                    if (pricing && !pricing.error) {
                        this.state.vehicle.pricing = pricing;
                        this.state.vehicle.price = pricing.finalPrice; // Update with calculated price
                        this.state.route.price = pricing.finalPrice;
                    } else {
                        // Keep carousel price if calculation fails
                        this.state.route.price = carouselPrice || null;
                    }
                } else {
                    // No route data - keep carousel price
                    this.state.route.price = carouselPrice || null;
                }
            }
            
            // ================= PR 3C-2B2 — server quote client =================
            // The contract, and why each piece is the way it is:
            //   * The request carries INTENT ONLY — mode, airportCode, placeId,
            //     pickupAt, passengers. The endpoint rejects any other field by
            //     name, including route facts and a vehicle preference.
            //   * There is deliberately no `vehicle` field: one quote prices
            //     every vehicle and signs a SEPARATE token per vehicle, each
            //     bound to its own vehicle. Choosing a vehicle therefore picks a
            //     different token from the same quote — it does not need a new
            //     quote, and issuing one would buy a second Google round trip
            //     for an identical answer.
            //   * pickupAt must carry a UTC offset. `Date.toISOString()` gives
            //     the Z form; an offset-less string would be re-read in the
            //     server's zone and silently reprice the ride.
            //   * The response's `intent.placeId` is CANONICAL — Google may
            //     supersede the id we sent. That canonical id is what gets
            //     submitted, or 2C's keyed-commitment recomputation will reject an honest
            //     booking.

            // SCOPE (PR 3C-2C-B PR-2) — creates AND pending edits. Edit
            // quotes carry the booking identity to /api/quote-ride, which
            // gates owner/status/version BEFORE any paid provider call and
            // mints purpose-'edit' tokens bound to the booking and its
            // driver era. While SERVER_QUOTE_ENABLED is false everything
            // here is inert and edits keep today's legacy path.
            quoteFlowActive() {
                return SERVER_QUOTE_ENABLED;
            }

            quoteIntent() {
                const { mode, locations, dateTime, passengers } = this.state;
                if (!locations.airport?.code || !locations.placeId || !dateTime.time) return null;
                const pickupAt = new Date(dateTime.time);
                if (isNaN(pickupAt.getTime())) return null;
                return {
                    mode,
                    airportCode: locations.airport.code,
                    placeId: locations.placeId,
                    pickupAt: pickupAt.toISOString(),
                    passengers: this.state.passengers
                };
            }

            quoteKey(intent) {
                if (!intent) return null;
                const parts = [intent.mode, intent.airportCode, intent.placeId,
                    intent.pickupAt, intent.passengers];
                // An edit quote answers a DIFFERENT question than a create
                // quote for the same route: scope the cache key by the booking
                // and its captured version so neither can impersonate the other.
                if (this.pendingEdit) {
                    parts.push('edit', this.pendingEdit.bookingId, this.pendingEdit.detailsVersion);
                }
                return parts.join('|');
            }

            invalidateQuote(reason) {
                if (!SERVER_QUOTE_ENABLED) return;
                const q = this.state.quote;
                // Cancel a QUEUED request before the early return below. A
                // debounced quote can be waiting while the state still reads
                // 'idle' with no data, and that queued request is for the
                // intent that just died.
                clearTimeout(this._quoteTimer);
                if (q.status === 'idle' && !q.data) return;
                debug.info?.(`🧾 quote invalidated: ${reason}`);
                q.seq++;                       // any in-flight response is now stale
                clearTimeout(this._quoteExpiryTimer);
                q.status = 'idle';
                q.key = null;
                q.data = null;
                q.error = null;
                if (this.state.vehicle) this.state.vehicle.quoteToken = null;
                this.renderQuoteState();
            }

            quoteIsFresh() {
                const q = this.state.quote;
                if (q.status !== 'ready' || !q.data) return false;
                if (this.quoteKey(this.quoteIntent()) !== q.key) return false;
                const expiry = this.quoteExpiryMs();
                return expiry !== null && Date.now() < expiry;
            }

            quoteExpiryMs() {
                const vehicles = this.state.quote.data?.vehicles;
                if (!vehicles) return null;
                // Every vehicle in one response shares an issue time; take the
                // earliest expiry present so nothing is ever used past its TTL.
                let earliest = null;
                Object.keys(vehicles).forEach(k => {
                    const t = Date.parse(vehicles[k]?.expiresAt || '');
                    if (!isNaN(t) && (earliest === null || t < earliest)) earliest = t;
                });
                return earliest;
            }

            selectedQuoteVehicle() {
                const key = this.state.vehicle?.type;
                const v = key && this.state.quote.data?.vehicles?.[key];
                return (v && v.ok) ? v : null;
            }

            // A successful HTTP response is not automatically a usable quote.
            // Missing canonical facts, money, expiry or a vehicle token means
            // LinkMia's response contract is broken; retrying the same intent
            // would only buy another Places + Routes call for the same defect.
            serverQuoteIsComplete(quote) {
                if (!quote || typeof quote !== 'object' ||
                    !quote.intent || typeof quote.intent !== 'object' ||
                    typeof quote.intent.placeId !== 'string' || !quote.intent.placeId ||
                    typeof quote.intent.airportCode !== 'string' || !quote.intent.airportCode ||
                    !quote.route || typeof quote.route !== 'object' ||
                    !Number.isSafeInteger(quote.route.milesTenths) || quote.route.milesTenths < 0 ||
                    !Number.isSafeInteger(quote.route.minutes) || quote.route.minutes < 0 ||
                    typeof quote.pricingVersion !== 'string' || !quote.pricingVersion ||
                    !quote.vehicles || typeof quote.vehicles !== 'object' ||
