                    Array.isArray(quote.vehicles)) return false;

                const expectedVehicleKeys = ['escalade', 'sprinter', 'tesla'];
                const actualVehicleKeys = Object.keys(quote.vehicles).sort();
                if (actualVehicleKeys.length !== expectedVehicleKeys.length ||
                    actualVehicleKeys.some((key, i) => key !== expectedVehicleKeys[i])) {
                    return false;
                }

                let vehiclesOk = 0;
                for (const vehicle of Object.values(quote.vehicles)) {
                    if (!vehicle || typeof vehicle !== 'object' || typeof vehicle.ok !== 'boolean') {
                        return false;
                    }
                    if (!vehicle.ok) continue;
                    vehiclesOk++;
                    if (typeof vehicle.token !== 'string' || !vehicle.token ||
                        !Number.isSafeInteger(vehicle.finalCents) || vehicle.finalCents < 0 ||
                        !Number.isFinite(Date.parse(vehicle.expiresAt || ''))) return false;
                }
                return quote.vehiclesOk === vehiclesOk &&
                    quote.bookable === (vehiclesOk > 0);
            }

            captureServerQuoteContract() {
                if (!this.quoteFlowActive() || !this.quoteIsFresh()) return null;
                const quote = this.state.quote.data;
                const selected = this.selectedQuoteVehicle();
                const vehicleKey = this.state.vehicle?.type;
                const milesTenths = quote?.route?.milesTenths;
                const routeMinutes = quote?.route?.minutes;
                const expiresAt = this.quoteExpiryMs();
                if (!selected?.token || !quote?.intent?.placeId ||
                    !quote?.intent?.airportCode || !vehicleKey ||
                    !Number.isSafeInteger(milesTenths) || milesTenths < 0 ||
                    !Number.isSafeInteger(routeMinutes) || routeMinutes < 1 || routeMinutes > 1440 ||
                    !Number.isFinite(expiresAt) || expiresAt <= Date.now() ||
                    !Number.isSafeInteger(selected.finalCents) || selected.finalCents < 0 ||
                    !quote?.pricingVersion) {
                    return null;
                }
                return Object.freeze({
                    seq: this.state.quote.seq,
                    key: this.state.quote.key,
                    token: selected.token,
                    placeId: quote.intent.placeId,
                    airportCode: quote.intent.airportCode,
                    vehicleKey,
                    routeMilesTenths: milesTenths,
                    routeMinutes,
                    pricingVersion: quote.pricingVersion,
                    finalCents: selected.finalCents,
                    expiresAt
                });
            }

            serverQuoteContractIsCurrent(contract) {
                if (!contract || !this.quoteFlowActive()) return false;
                const selected = this.selectedQuoteVehicle();
                return this.state.quote.seq === contract.seq &&
                    this.state.quote.key === contract.key &&
                    this.quoteKey(this.quoteIntent()) === contract.key &&
                    this.state.vehicle?.type === contract.vehicleKey &&
                    selected?.token === contract.token &&
                    Date.now() < contract.expiresAt;
            }

            // Attach only the canonical server-quote contract. Route facts use
            // integer units echoed by quote-ride, never the browser's legacy
            // route cache. They are resubmitted so 2C can recompute the keyed
            // commitment; they do not become raw fields inside the token.
            attachServerQuoteContract(apiPayload, contract = null) {
                // Disabled/edit flows intentionally carry no create quote. If
                // this WAS a quote-backed submission, however, never fall back
                // silently because state changed during the authentication
                // await: every request fact and token must remain one snapshot.
                if (!contract) {
                    if (this.quoteFlowActive()) {
                        throw new Error('The authoritative quote is incomplete — please refresh the price.');
                    }
                    return apiPayload;
                }
                if (!this.serverQuoteContractIsCurrent(contract)) {
                    throw new Error('Your ride or price changed while booking — please review it and try again.');
                }

                apiPayload.quoteToken = contract.token;
                apiPayload.placeId = contract.placeId;
                apiPayload.airportCode = contract.airportCode;
                apiPayload.vehicleKey = contract.vehicleKey;
                apiPayload.routeMilesTenths = contract.routeMilesTenths;
                apiPayload.routeMinutes = contract.routeMinutes;
                apiPayload.pricingVersion = contract.pricingVersion;
                // This legacy duration comes from the browser/Railway cache.
                // A verified write must use only the route minutes authenticated
                // by the quote commitment, so do not send both truths.
                delete apiPayload.durationMinutes;
                return apiPayload;
            }

            async requestServerQuote({ force = false } = {}) {
                // quoteFlowActive(), not the raw flag: a debounce timer queued
                // before a pending edit began could otherwise fire inside the
                // edit flow and request a create-scoped quote for it.
                if (!this.quoteFlowActive()) return;
                // The Vehicle step is the only place a passenger needs a live
                // price. A debounce can be queued there and fire after they
                // navigate back to When, so recheck the stage at execution time
                // before buying a Places + Compute Routes Pro pair.
                if (this.state.ui?.currentPanel !== 'vehicle') return;

                const intent = this.quoteIntent();
                const key = this.quoteKey(intent);
                if (!intent) { this.invalidateQuote('intent incomplete'); return; }

                const q = this.state.quote;
                if (!force && q.key === key && this.quoteIsFresh()) return;
                if (!force && q.key === key && q.status === 'loading') return;
                // A permanent refusal (bad address identity, no drivable route) is
                // a property of THIS intent. Re-entering the Vehicle step must not
                // buy another Places + Routes call to be told the same thing. Only
                // an explicit retry, or a changed intent, tries again.
                if (!force && q.key === key && q.status === 'error' &&
                    q.error && q.error.retryable === false) return;

                const seq = ++q.seq;
                q.status = 'loading';
                q.key = key;
                q.data = null;
                q.error = null;
                if (this.state.vehicle) this.state.vehicle.quoteToken = null;
                this.renderQuoteState();

                try {
                    if (!window.supabaseClient) throw new Error('auth client unavailable');
                    const { data: { session } } = await window.supabaseClient.auth.getSession();
                    if (!session?.access_token) throw new Error('not signed in');

                    // Acquiring the session is an await. The intent can change
                    // during it, and the next call is the one that spends money
                    // at Google — so check before the fetch, not only after.
                    if (seq !== q.seq) return;
                    if (!this.quoteFlowActive() || this.state.ui?.currentPanel !== 'vehicle') {
                        // Do not leave this intent stuck as "loading": returning
                        // to Vehicle must be able to request it normally.
                        this.invalidateQuote('left Vehicle before quote request');
                        return;
                    }

                    // Edit quotes carry the booking identity. The captured
                    // detailsVersion is the CAS the save will use — the server
                    // echo never replaces it.
                    const requestBody = this.pendingEdit
                        ? { ...intent,
                            bookingId: this.pendingEdit.bookingId,
                            expectedDetailsVersion: this.pendingEdit.detailsVersion }
                        : intent;
                    const res = await fetch('/api/quote-ride', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${session.access_token}`
                        },
                        body: JSON.stringify(requestBody)
                    });

                    if (seq !== q.seq) return;   // the intent moved on; drop this answer

                    let payload = null;
                    try { payload = await res.json(); } catch (_) { payload = null; }

                    // RECHECK. Parsing the body is itself an await, so the intent
                    // can change between the header check above and here. Without
                    // this, a slow first response could be stored under a newer
                    // request's key and make Book look valid carrying the OLD
                    // price and token.
                    if (seq !== q.seq) return;

                    if (!res.ok) {
                        // edit_stale gets its own branch BEFORE the generic
                        // handling: the ride changed since the edit began, and
                        // the honest move is explicit review — never a silent
                        // version refresh (the captured CAS is sacred).
                        if (payload?.error === 'edit_stale') {
                            q.status = 'error';
                            q.error = {
                                message: 'This ride changed since you opened it. Please reopen it from your trip page to edit the latest version.',
                                retryable: false,
                                editStale: true
                            };
                            this.renderQuoteState();
                            return;
                        }
                        // 400 identity refusals are the passenger's to fix. 422 is a
                        // real "no route". Everything else is ours, and says so.
                        const retryable = res.status >= 500 || res.status === 429;
                        q.status = 'error';
                        q.error = {
                            message: payload?.error || 'Could not get a price right now',
                            retryable
                        };
                        this.renderQuoteState();
                        return;
                    }

                    const quote = payload?.quote;
                    if (!this.serverQuoteIsComplete(quote)) {
                        // This is our response/configuration defect, not a
                        // transient provider outage and not a passenger input
                        // problem. Fail closed without offering or scheduling
                        // another paid request for the unchanged intent.
                        q.status = 'error';
                        q.error = {
                            message: 'Pricing is unavailable right now. Please contact LinkMia to book this ride.',
                            retryable: false
                        };
                        this.renderQuoteState();
                        return;
                    }
                    if (quote.bookable === false) {
                        q.status = 'error';
                        q.error = { message: 'No vehicle is available for this trip', retryable: false };
                        this.renderQuoteState();
                        return;
                    }

                    q.status = 'ready';
                    q.data = quote;
                    q.error = null;
                    this.applyServerPrices();
                    this.armQuoteExpiry();
                    this.shadowComparePricing();
                    this.renderQuoteState();
                } catch (err) {
                    if (seq !== q.seq) return;
                    console.error('Quote request failed:', err?.name || 'error');
                    q.status = 'error';
                    q.error = { message: 'Could not reach the pricing service', retryable: true };
                    this.renderQuoteState();
                }
            }

            scheduleQuote() {
                if (!this.quoteFlowActive()) return;
                // Quotes cost a Places + Compute Routes Pro call each. Route and
                // time changes happen on the Where and When screens, often several
                // in a row while the passenger is still deciding. Only the Vehicle
                // step — where a price is actually shown — may spend.
                if (this.state.ui?.currentPanel !== 'vehicle') return;
                clearTimeout(this._quoteTimer);
                this._quoteTimer = setTimeout(() => this.requestServerQuote(), QUOTE_DEBOUNCE_MS);
            }

            // The carousel ships hardcoded placeholder figures in its markup
            // ($132/$165/$220) and otherwise keeps whatever it was last told.
            // Both are lies whenever there is no valid quote, so every state
            // that is not "fresh server price" replaces the visible numbers.
            setCarouselPlaceholder(label) {
                this.vehiclePrices = null;
                // A placeholder replaces PRICE truth, not availability truth.
                // Keep the last refusal set until a later successful quote
                // explicitly replaces it. Clearing it here briefly re-enabled
                // vehicles the server had refused while a retry/loading/error
                // state was on screen.
                const unavailable = Array.isArray(this.carouselState?.unavailable)
                    ? this.carouselState.unavailable.slice()
                    : [];
                this.carouselState = { kind: 'placeholder', label, unavailable };
                this.pushCarouselState();
            }

            // The iframe may not have installed its message listener yet, and
            // it ships hardcoded prices in its markup. Posting once and hoping
            // meant a placeholder could be dropped on the floor and the markup
            // figures ($132/$165/$220) would sit there looking like real
            // prices. So the LAST intended presentation is kept and replayed
            // whenever the carousel announces it is ready.
            pushCarouselState() {
                const st = this.carouselState;
                if (!st) return;
                const iframe = document.getElementById('vehicle-carousel-frame');
                if (!iframe || !iframe.contentWindow) return;
                const post = (msg) => iframe.contentWindow.postMessage(msg, '*');
                if (st.kind === 'placeholder') {
                    post({ type: 'clearPrices', data: { label: st.label } });
                    // Loading/error/expired states have no newer availability
                    // truth. Preserve the last authoritative refusal set until
                    // a successful quote replaces it (possibly with []).
                    post({ type: 'setUnavailable', data: { ids: st.unavailable || [] } });
                    return;
                }
                post({ type: 'updatePrices', data: st.prices });
                if (st.unavailable && st.unavailable.length) {
                    // A vehicle the engine refused (party too large, beyond the
                    // service area) must say so, not sit on a stale '…'.
                    post({ type: 'clearPrices', data: { label: 'Unavailable', ids: st.unavailable } });
                }
                // Always replace the disabled set, INCLUDING with an empty
                // array. Otherwise a vehicle refused by quote A remains dead
                // after quote B makes every vehicle bookable.
                post({ type: 'setUnavailable', data: { ids: st.unavailable || [] } });
            }

            // A price that has passed its TTL must stop looking valid on screen,
            // not only when the passenger finally clicks Book.
            armQuoteExpiry() {
                clearTimeout(this._quoteExpiryTimer);
                const exp = this.quoteExpiryMs();
                if (exp === null) return;
                const ms = exp - Date.now();
                if (ms <= 0) { this.renderQuoteState(); return; }
                this._quoteExpiryTimer = setTimeout(() => this.renderQuoteState(), ms + 250);
            }

            // Server cents are the displayed price. Nothing else may write here.
            applyServerPrices() {
                const vehicles = this.state.quote.data?.vehicles || {};
                const prices = {};
                const unavailable = [];
                Object.keys(vehicles).forEach(k => {
                    if (vehicles[k]?.ok) prices[k] = vehicles[k].finalCents / 100;
                    else unavailable.push(k);
                });
                if (!Object.keys(prices).length) return;

                this.vehiclePrices = prices;
                this.carouselState = { kind: 'prices', prices, unavailable };
                this.pushCarouselState();

                // A refused vehicle must not stay selected with a stale price.
                if (this.state.vehicle?.type && unavailable.indexOf(this.state.vehicle.type) >= 0) {
                    this.state.vehicle.quoteToken = null;
                }

                const selected = this.state.vehicle?.type;
                if (selected && vehicles[selected]?.ok) {
                    this.state.vehicle.price = prices[selected];
                    this.state.vehicle.quoteToken = vehicles[selected].token;
                    this.state.route.price = prices[selected];
                }
            }

            // pricing.js still runs, but ONLY as a shadow: it is logged and
            // never displayed, never stored, never submitted. Divergence is
            // expected and large — the two use different route facts (the
            // browser asks for "now", the server asks for the scheduled pickup)
            // — so this is telemetry, not a check that should ever "fail".
            shadowComparePricing() {
                try {
                    const vehicles = this.state.quote.data?.vehicles || {};
                    const { distance, duration } = this.state.route;
                    if (!this.pricingService || !distance || !duration) return;
                    const rows = {};
                    Object.keys(vehicles).forEach(k => {
                        if (!vehicles[k]?.ok) return;
                        const local = this.calculateVehiclePrice(k, distance, duration);
                        if (!local || local.error) return;
                        const server = vehicles[k].finalCents / 100;
                        rows[k] = {
                            server,
                            browser: local.finalPrice,
                            deltaPct: +(((server / local.finalPrice) - 1) * 100).toFixed(1)
                        };
                    });
                    console.log('🔍 quote shadow (browser vs server, not displayed):', rows);
                } catch (_) { /* a shadow must never affect the booking */ }
            }

            renderQuoteState() {
                const panel = document.querySelector('#vehiclePanel .content-section');
                if (!panel) return;
                let el = document.getElementById('quoteStatus');

                if (!this.quoteFlowActive()) { el?.remove(); return; }

                const q = this.state.quote;
                const fresh = this.quoteIsFresh();
                // PR-2 passive expiry: a lapsed quote shows the Expired card
                // and relabels the PRIMARY action ("Refresh and Book/Save") —
                // no banner, no alert, and zero provider calls while idle.
                const show = q.status === 'loading' || q.status === 'error' ||
                             q.status === 'idle';

                // Whatever is on screen must match the state named in the banner.
                if (q.status === 'loading')      this.setCarouselPlaceholder('…');
                else if (q.status === 'error')   this.setCarouselPlaceholder('Unavailable');
                else if (q.status === 'idle')    this.setCarouselPlaceholder('—');
                else if (!fresh)                 this.setCarouselPlaceholder('Expired');

                if (!show) { el?.remove(); this.updateBookAvailability(); return; }

                if (!el) {
                    el = document.createElement('div');
                    el.id = 'quoteStatus';
                    el.setAttribute('role', 'status');
                    panel.prepend(el);
                }

                let bg = '#2C2C2E', border = 'rgba(255,255,255,0.12)', color = '#EBEBF0', text = '';
                let action = null;

                if (q.status === 'loading') {
                    text = 'Getting current prices…';
                } else if (q.status === 'idle') {
                    text = 'Getting current prices…';
                } else {
                    const retryable = q.error?.retryable !== false;
                    bg = 'rgba(255,69,58,0.10)'; border = 'rgba(255,69,58,0.45)'; color = '#F3C6C2';
                    text = q.error?.message || 'Could not get a price right now';
                    if (retryable) action = 'Try again';
                }

                el.style.cssText = 'margin:0 0 12px;padding:12px 14px;border-radius:12px;' +
                    `background:${bg};border:1px solid ${border};color:${color};` +
                    'font-size:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;';
                el.innerHTML = '';
                const span = document.createElement('span');
                span.style.flex = '1';
                span.textContent = text;
                el.appendChild(span);
                if (action) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.textContent = action;
                    btn.style.cssText = 'border:1px solid currentColor;background:transparent;' +
                        'color:inherit;border-radius:8px;padding:6px 12px;font-size:13px;' +
                        'font-weight:600;cursor:pointer;font-family:inherit;';
                    btn.addEventListener('click', () => this.requestServerQuote({ force: true }));
                    el.appendChild(btn);
                }
                this.updateBookAvailability();
            }

            setBookLabel(text) {
                const btn = this.els.bookBtn || document.getElementById('bookBtn');
                const label = btn?.querySelector('.btn-main-text');
                if (label) label.textContent = text;
                else if (btn) btn.innerHTML = `<span class="btn-main-text">${text}</span>`;
            }

            // Interaction markers (PR-2, plan v3.1 §4): a restored edit form
            // is NOT the ride — only explicit actions in THIS edit session
            // count. Prefilled or merely nonempty values never do.
            editReady() {
                if (!this.pendingEdit || !this.quoteFlowActive()) return true;
                const m = this.editMarkers || {};
                return !!(m.routeDirection && m.routeAddress && m.pickupAt && m.vehicle);
            }

            // A quote that is missing or incomplete blocks Book/Save — there is
            // deliberately no fallback to the browser calculator: the price
            // shown and the price submitted must be the same number. A quote
            // that is merely EXPIRED keeps the primary action PHYSICALLY
            // CLICKABLE as "Refresh and Book/Save": the tap accepts the shown
            // choice and triggers exactly one quiet refresh; stale data is
            // never submitted (plan v3.1 §4, ratified DQ-1 UX).
            updateBookAvailability() {
                const btn = this.els.bookBtn || document.getElementById('bookBtn');
                if (!btn) return;
                const baseLabel = this.pendingEdit ? 'Save changes' : 'Book Service';
                if (!this.quoteFlowActive()) { btn.disabled = false; return; }

                if (this._quoteRefreshing) {
                    btn.disabled = true;
                    btn.style.opacity = '0.5';
                    btn.style.cursor = 'wait';
                    this.setBookLabel('Updating price…');
                    return;
                }

                if (this._submitInFlight) {
                    // confirmBooking owns the button ('Processing...') until
                    // the submission settles; expiry timers and carousel
                    // events must never re-enable it mid-flight.
                    btn.disabled = true;
                    btn.style.opacity = '0.5';
                    btn.style.cursor = 'wait';
                    return;
                }

                const q = this.state.quote;
                const fresh = this.quoteIsFresh();
                const selected = !!this.selectedQuoteVehicle();
                const intentCurrent = this.quoteKey(this.quoteIntent()) === q.key;
                const editBlocked = !this.editReady();
                const staleButComplete = !fresh && q.status === 'ready' &&
                    selected && intentCurrent;

                let ok = false;
                let label = baseLabel;
                if (!editBlocked && fresh && selected) {
                    ok = true;
                } else if (!editBlocked && staleButComplete) {
                    // Clickable while stale — the tap performs the quiet refresh.
                    ok = true;
                    label = this.pendingEdit ? 'Refresh and Save' : 'Refresh and Book';
                }
                btn.disabled = !ok;
                btn.style.opacity = ok ? '' : '0.5';
                btn.style.cursor = ok ? '' : 'not-allowed';
                this.setBookLabel(label);
            }

            calculateVehiclePrice(vehicleType, distance, duration, options = {}) {
                if (this.pricingService) {
                    // Prepare options with all necessary data for accurate pricing
                    options.passengers = this.state.passengers;
                    
                    // Add dateTime for surge pricing calculations
                    if (this.state.dateTime.time) {
                        options.dateTime = new Date(this.state.dateTime.time);
                    }
                    
                    // Add origin/destination for popular route detection
                    if (this.state.locations.airport && this.state.locations.address) {
                        options.origin = this.state.locations.airport.code;
                        options.destination = this.state.locations.address.place_id || 'CUSTOM';
                    }
                    
                    console.log(`💵 Calculating price for ${vehicleType}:`, {
                        distance: distance + ' mi',
                        duration: Math.round(duration) + ' min', 
                        passengers: options.passengers,
                        dateTime: options.dateTime?.toLocaleString(),
                        origin: options.origin
                    });
                    
                    const pricing = this.pricingService.calculateVehiclePrice(vehicleType, distance, duration, options);
                    
                    if (pricing) {
                        console.log(`✅ ${vehicleType.toUpperCase()} pricing:`, {
                            basePrice: '$' + pricing.basePrice,
                            finalPrice: '$' + pricing.finalPrice,
                            protectionType: pricing.protectionApplied,
                            surcharges: pricing.breakdown.appliedSurcharges.length,
                            psychologicalPricing: pricing.finalPrice % 1 !== 0 ? 'Applied' : 'Rounded'
                        });
                    }
                    
                    return pricing;
                } else {
                    console.warn('⚠️ Pricing service unavailable for', vehicleType);
                    return { error: 'Pricing service unavailable' };
                }
            }
            
            updateVehiclePrices() {
                // PR 3C-2B2: when the server quote is authoritative, pricing.js
                // must not write a displayed price. It still runs, but only via
                // shadowComparePricing(), whose output is logged and discarded.
                // Letting this function through would let the browser's number
                // overwrite the server's between a quote and a submit — exactly
                // the "shown $95, booked $85" split this PR exists to close.
                if (this.quoteFlowActive()) {
                    this.scheduleQuote();
                    return;
                }

                if (!this.state.route.distance || !this.state.route.duration) {
                    console.log('⏳ No route data available for pricing');
                    return;
                }
                
                const vehicleTypes = this.pricingService ? 
                    this.pricingService.getAllVehicles() : 
                    ['tesla', 'escalade', 'sprinter'];
                
                console.log('🔄 Updating prices for route:', {
                    distance: this.state.route.distance + ' miles',
                    duration: Math.round(this.state.route.duration) + ' minutes',
                    from: this.state.locations.address?.description || 'Custom address',
                    to: this.state.locations.airport?.name || 'Airport'
                });
                
                // Log surge pricing information if applicable
                if (this.pricingService && this.state.dateTime.time) {
                    const surgeInfo = this.pricingService.checkSurgePeriod(new Date(this.state.dateTime.time));
                    if (surgeInfo.hasSurge) {
                        console.log('⚡ Surge pricing active:', {
                            surges: surgeInfo.surges.map(s => s.description).join(', '),
                            totalMultiplier: surgeInfo.totalMultiplier + 'x'
                        });
                    } else {
                        console.log('✅ No surge pricing applied');
                    }
                }
                
                // Update standalone carousel prices
                const prices = {};
                vehicleTypes.forEach(vehicleType => {
                    const pricing = this.calculateVehiclePrice(
                        vehicleType, 
                        this.state.route.distance, 
                        this.state.route.duration
                    );
                    if (pricing && !pricing.error) {
                        prices[vehicleType] = pricing.finalPrice;
                    }
                });
                
                // Send prices to carousel iframe
                if (Object.keys(prices).length > 0) {
                    // Pending edits intentionally remain on legacy pricing. It
                    // has no server refusal set, so replace both the live iframe
                    // state and the replayable presentation with an empty set.
                    this.carouselState = { kind: 'prices', prices, unavailable: [] };
                    const iframe = document.getElementById('vehicle-carousel-frame');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage({
                            type: 'updatePrices',
                            data: prices
                        }, '*');
                        // Pending edits intentionally remain on legacy pricing.
                        // Clear any disabled cards left by an earlier server
                        // quote before handing the carousel back to that flow.
                        iframe.contentWindow.postMessage({
                            type: 'setUnavailable',
                            data: { ids: [] }
                        }, '*');
                        console.log('💸 Sent prices to carousel iframe:', prices);
                    }
                    
                    // Store prices for later use
                    this.vehiclePrices = prices;

                    // IMPORTANT: Also update selected vehicle's pricing if one is already selected
                    if (this.state.vehicle?.type && prices[this.state.vehicle.type]) {
                        const selectedVehiclePricing = this.calculateVehiclePrice(
                            this.state.vehicle.type,
                            this.state.route.distance,
                            this.state.route.duration
                        );
                        if (selectedVehiclePricing && !selectedVehiclePricing.error) {
                            this.state.vehicle.pricing = selectedVehiclePricing;
                            this.state.route.price = selectedVehiclePricing.finalPrice;
                            console.log('✅ Updated selected vehicle pricing:', this.state.vehicle.type, '$' + selectedVehiclePricing.finalPrice);
                        }
                    }
                }
            }

            validateVehicleCapacity() {
                // TODO: Refactor to send capacity validation to iframe via postMessage
                // The iframe should handle disabling vehicles that can't accommodate passengers
                // For now, this function is disabled as vehicleCards are in the iframe
                
                /*
                const passengerCount = this.state.passengers;
                
                // Need to send message to iframe like:
                // iframe.contentWindow.postMessage({
                //     type: 'updateCapacity',
                //     passengerCount: passengerCount,
                //     vehicleConfig: this.vehicleConfig
                // }, '*');
                */
            }
            
            async updateVehicleMap() {
                if (!this.els.vehicleMap) return;
                
                try {
                    if (!this.vehicleMap) {
                        await google.maps.importLibrary("maps");
                        
                        const mapOptions = {
                            center: { lat: 25.7617, lng: -80.1918 },
                            zoom: 11,
                            disableDefaultUI: true,
                            zoomControl: false,
                            mapTypeControl: false,
                            scaleControl: false,
                            streetViewControl: false,
                            rotateControl: false,
                            fullscreenControl: false,
                            styles: [
                                {
                                    featureType: "poi",
                                    elementType: "labels",
                                    stylers: [{ visibility: "off" }]
                                }
                            ]
                        };
                        
                        this.vehicleMap = new google.maps.Map(
                            this.els.vehicleMap,
                            mapOptions
                        );
                        
                        this.directionsRenderer = new google.maps.DirectionsRenderer({
                            map: this.vehicleMap,
                            suppressMarkers: false,
                            polylineOptions: {
                                strokeColor: '#FF6B35',
                                strokeOpacity: 0.8,
                                strokeWeight: 4
                            }
                        });
                        
                        // Initialize DirectionsService for map display
                        this.directionsService = new google.maps.DirectionsService();
                    }
                    
                    if (this.state.locations.address && this.state.locations.airport) {
                        const airportCoords = this.getAirportCoordinates(this.state.locations.airport.code);
                        
                        let origin, destination;
                        if (this.state.mode === 'dropoff') {
                            origin = this.state.locations.address.address;
                            destination = new google.maps.LatLng(airportCoords.lat, airportCoords.lng);
                        } else {
                            origin = new google.maps.LatLng(airportCoords.lat, airportCoords.lng);
                            destination = this.state.locations.address.address;
                        }
                        
                        const request = {
                            origin: origin,
                            destination: destination,
                            travelMode: google.maps.TravelMode.DRIVING
                        };
                        
                        this.directionsService.route(request, (result, status) => {
                            if (status === google.maps.DirectionsStatus.OK) {
                                this.directionsRenderer.setDirections(result);
                            }
                        });
                    }
                } catch (error) {
                    console.error('Map update error:', error);
                }
            }
            
            // Handle booking button click - open passenger modal first
            handleBookingClick() {
                // One submission at a time. While an envelope (or legacy
                // POST) is in flight, quote-expiry timers and carousel events
                // may recompute the button, but a tap must never start a
                // second concurrent chain — that would overwrite the tap
                // snapshot, spend another chain's budget, and clobber the
                // single-slot recovery envelope.
                if (this._submitInFlight) return;
                const passengerModal = PassengerModal.getInstance();

                // PR-2: the TAP is the acceptance boundary. Freeze what the
                // passenger accepted — intent, vehicle, cents, and the quote
                // sequence — BEFORE the passenger modal. It is rechecked after
                // the modal, after session acquisition, and after any quiet
                // refresh; automatic submission happens only while all of it
                // still reconciles (at most 1 refresh + 1 auto-resubmit per
                // tap; any change requires a new visible tap).
                if (this.quoteFlowActive()) {
                    const q = this.state.quote;
                    const sel = this.selectedQuoteVehicle();
                    if (!sel || !this.state.vehicle?.type) return; // nothing accepted
                    this._tapSnapshot = {
                        intentKey: this.quoteKey(this.quoteIntent()),
                        vehicleKey: this.state.vehicle.type,
                        finalCents: sel.finalCents,
                        acceptedQuoteSeq: q.seq,
                        refreshUsed: false,
                        resubmitUsed: false
                    };
                    if (!this._tapSnapshot.intentKey ||
                        !Number.isInteger(this._tapSnapshot.finalCents)) return;
                }

                // Edit sessions require an EXPLICIT traveler review in the
                // modal every time (prefilled data never counts as confirmed).
                const needsExplicitTraveler = this.pendingEdit &&
                    this.quoteFlowActive() && !this.editMarkers?.traveler;

                if (passengerModal.hasUserData() && !needsExplicitTraveler) {
                    // User already provided info, proceed to booking
                    this.confirmBooking();
                } else {
                    // Open passenger modal to collect (or explicitly re-confirm)
                    passengerModal.openRequired(() => {
                        console.log('✅ User info collected, proceeding to booking');
                        if (this.pendingEdit && this.editMarkers) this.editMarkers.traveler = true;
                        this.confirmBooking();
                    });
                }
            }

            beginPendingEdit({ bookingId, tripCode, detailsVersion }) {
                if (!bookingId) return;
                this.pendingEdit = {
                    bookingId,
                    tripCode: tripCode || currentActiveBooking?.trip_id || '',
                    detailsVersion: Number(detailsVersion) ||
                        Number(currentActiveBooking?.details_version) || 1
                };
                // Interaction markers (plan v3.1 §4, sign-off pin): reset at
                // EVERY edit start. Only explicit actions in this edit session
                // set them; a restored/prefilled form never counts. Save stays
                // unavailable until direction+address, pickup time, and vehicle
                // were each explicitly chosen; the traveler details are
                // explicitly reviewed in the modal at the Save tap.
                this.editMarkers = {
                    routeDirection: false, routeAddress: false,
                    pickupAt: false, vehicle: false, traveler: false
                };
                this.invalidateQuote('pending edit started — create-scoped quotes do not apply');
                this.activeSheetBookingId = bookingId;
                this.startBooking();
                this.navigateToPanel('where');

                let notice = document.getElementById('editRideNotice');
                if (!notice) {
                    notice = document.createElement('div');
                    notice.id = 'editRideNotice';
                    notice.style.cssText = 'margin:12px 16px;padding:12px 14px;border-radius:12px;background:#fff3e0;color:#a85b00;font-weight:600;';
                    this.els.bookingContainer?.prepend(notice);
                }
                notice.textContent = `Editing ${this.pendingEdit.tripCode || 'your pending ride'}. Your existing ride stays active until these changes are saved.` +
                    (this.quoteFlowActive() ? ' Re-enter your trip details to change this ride.' : '');
                const bookBtn = document.getElementById('bookBtn');
                if (bookBtn) {
                    bookBtn.innerHTML = '<span class="btn-main-text">Save changes</span>';
                    bookBtn.disabled = false;
                }
                // Under the quote flow, Save starts DISABLED — the markers
                // are all unset, and an enabled button whose taps are silent
                // no-ops would be dishonest. (Flag off keeps the legacy
                // enabled button above.)
                if (this.quoteFlowActive()) this.updateBookAvailability();
            }

            finishPendingEdit() {
                this.pendingEdit = null;
                document.getElementById('editRideNotice')?.remove();
            }

            // ONE quiet refresh per tap (plan v3.1 §4). The refresh's own
            // sequence discipline lives inside requestServerQuote (a stale or
            // interleaved response is dropped by seq guards); afterwards the
            // CURRENT quote must still answer the tap's exact intent, vehicle
            // and cents, or automatic submission is cancelled.
            async quietRefreshForTap(snap) {
                if (snap.refreshUsed) {
                    this.notePriceChanged('Please review the refreshed price and tap again.');
                    return false;
                }
                snap.refreshUsed = true;
                this._quoteRefreshing = true;
                this.updateBookAvailability();
                try {
                    await this.requestServerQuote({ force: true });
                } finally {
                    this._quoteRefreshing = false;
                }
                this.updateBookAvailability();
                const q = this.state.quote;
                if (q.status !== 'ready' || !this.quoteIsFresh()) return false;
                if (this.quoteKey(this.quoteIntent()) !== snap.intentKey) return false;
                if (this.state.vehicle?.type !== snap.vehicleKey) return false;
                const sel = this.selectedQuoteVehicle();
                if (!sel) return false;
                if (sel.finalCents !== snap.finalCents) {
                    this.notePriceChanged('Price updated — review the new price and tap again.');
                    return false;
                }
                return true;
            }

            // A one-line, alert-free note under the primary action. Error and
            // edit paths rewrite the button with only the main-text span, so
            // the note target is (re)created here — the quiet path's one
            // honest line must never be silently dropped.
            notePriceChanged(text) {
                const btn = this.els.bookBtn || document.getElementById('bookBtn');
                if (btn) {
                    let sub = btn.querySelector('.btn-sub-text');
                    if (!sub) {
                        sub = document.createElement('span');
                        sub.className = 'btn-sub-text';
                        btn.appendChild(sub);
                    }
                    sub.textContent = text;
                    clearTimeout(this._bookNoteTimer);
                    this._bookNoteTimer = setTimeout(() => { sub.textContent = ''; }, 8000);
                }
                this.renderQuoteState();
                this.updateBookAvailability();
            }

            // Durable pending envelope (plan v3.1 §1): bound to the signed-in
            // account and its kind/booking context; cleared only by a definitive
            // mapped response, explicit Discard, logout, or account mismatch.
            // sessionStorage survives a same-tab reload — that is the honest,
            // documented scope. bodyString is never displayed or logged.
            storePendingEnvelope(envelope) {
                try { sessionStorage.setItem('lm_pending_envelope', JSON.stringify(envelope)); } catch (_) {}
            }
            clearPendingEnvelope(operationId = null) {
                // With an operationId, clear ONLY that operation's envelope —
                // a settling chain must never delete a different operation's
                // stored recovery. Without one (Discard, logout), clear
                // whatever the slot holds.
                try {
                    if (operationId) {
                        const raw = sessionStorage.getItem('lm_pending_envelope');
                        if (raw && JSON.parse(raw)?.operationId !== operationId) return;
                    }
                    sessionStorage.removeItem('lm_pending_envelope');
                } catch (_) {}
            }
            readPendingEnvelope(authSubject) {
                try {
                    const raw = sessionStorage.getItem('lm_pending_envelope');
                    if (!raw) return null;
                    const env = JSON.parse(raw);
                    if (!env || env.authSubject !== authSubject) {
                        // Different account (or corrupt) — never offer it.
                        sessionStorage.removeItem('lm_pending_envelope');
                        return null;
                    }
                    return env;
                } catch (_) { return null; }
            }

            // Pending-envelope recovery (plan v3.1 §4). Offered only to the
            // SAME authenticated account that created it; "Check again"
            // re-sends the exact stored bytes (idempotent by receipt — an
            // already-created ride is found, never duplicated). This is the
            // complete recovery path, including ambassador guest bookings.
            offerPendingEnvelope(authSubject) {
                if (!this.quoteFlowActive()) return;
                const env = this.readPendingEnvelope(authSubject);
                if (!env) return;
                let card = document.getElementById('pendingEnvelopeCard');
                if (!card) {
                    card = document.createElement('div');
                    card.id = 'pendingEnvelopeCard';
                    card.setAttribute('role', 'alert');
                    card.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);' +
                        'bottom:16px;z-index:10000;max-width:544px;width:calc(100% - 32px);' +
                        'background:#2C2C2E;border:1px solid rgba(255,179,64,0.45);border-radius:14px;' +
                        'padding:14px 16px;color:#EBEBF0;font-size:14px;display:flex;gap:10px;' +
                        'align-items:center;flex-wrap:wrap;box-shadow:0 8px 32px rgba(0,0,0,0.5);';
                    document.body.appendChild(card);
                }
                const mkBtn = (text, solid) => {
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.textContent = text;
                    b.style.cssText = 'border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;' +
                        'cursor:pointer;font-family:inherit;' + (solid
                            ? 'border:none;background:linear-gradient(135deg,#FF9933,#FF5733);color:#fff;'
                            : 'border:1px solid rgba(255,255,255,0.3);background:transparent;color:inherit;');
                    return b;
                };
                card.innerHTML = '';
                const span = document.createElement('span');
                span.style.flex = '1';
                span.textContent = env.kind === 'edit'
                    ? "We couldn't confirm your last ride change."
                    : "We couldn't confirm your last booking.";
                const checkBtn = mkBtn('Check again', true);
                const discardBtn = mkBtn('Discard', false);
                card.append(span, checkBtn, discardBtn);

                discardBtn.addEventListener('click', () => {
                    this.clearPendingEnvelope();
                    card.remove();
                });
                checkBtn.addEventListener('click', async () => {
                    checkBtn.disabled = true;
                    checkBtn.textContent = 'Checking…';
                    try {
                        const { data: { session } } = await window.supabaseClient.auth.getSession();
                        if (!session?.access_token || session.user?.id !== env.authSubject) {
                            span.textContent = 'Please sign in with the same account to check this.';
                            return;
                        }
                        const url = env.kind === 'edit'
                            ? '/api/update-pending-booking'
                            : '/api/create-booking';
                        const out = await this.submitEnvelope(url, env.bodyString, session.access_token);
                        if (!out.definitive) {
                            span.textContent = "Still couldn't confirm — check your connection and try again.";
                            return;
                        }
                        this.clearPendingEnvelope();
                        card.remove();
                        const { response, result } = out;
                        if (response.ok && result?.bookingId) {
                            try { localStorage.setItem('lm_last_trip_id', result.bookingId); } catch (_) {}
                            if (env.kind === 'edit') {
                                // A recovered edit is a committed edit: close
                                // the edit session and adopt the server's
                                // version, exactly like the direct save path.
                                currentActiveBooking = {
                                    ...(currentActiveBooking || {}),
                                    id: result.bookingId,
                                    trip_id: result.tripId || currentActiveBooking?.trip_id,
                                    status: 'pending',
                                    details_version: result.detailsVersion ??
                                        currentActiveBooking?.details_version
                                };
                                this.finishPendingEdit();
                            }
                            this.showTripSheet(result.bookingId);
                        } else if (response.status === 409 && result?.existingBookingId) {
                            this.showTripSheet(result.existingBookingId);
                        } else if (response.status === 428 && result?.reload === true) {
                            window.location.reload();
                        } else {
                            alert(env.kind === 'edit'
                                ? 'The change was not applied. Your original ride is unchanged.'
                                : 'Nothing was booked. Please book again when ready.');
                        }
                    } finally {
                        checkBtn.disabled = false;
                        checkBtn.textContent = 'Check again';
                    }
                });
            }

            // Bounded submission with exact-byte retry. UNKNOWN results —
            // timeout, connection loss/abort, unexpected 5xx/429, invalid or
            // non-JSON responses — retain the envelope and retry ONCE with the
            // identical bytes; only a recognized mapped response is definitive.
            async submitEnvelope(url, bodyString, accessToken) {
                const attempt = async () => {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 15000);
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${accessToken}`
                            },
                            body: bodyString,
                            signal: controller.signal
                        });
                        let result = null;
                        let parsed = false;
                        try { result = await response.json(); parsed = true; } catch (_) {}
                        const definitive = parsed && (response.ok ||
                            [400, 401, 403, 404, 409, 428, 503].includes(response.status));
                        return definitive ? { definitive: true, response, result } : { definitive: false };
                    } catch (_) {
                        return { definitive: false };
                    } finally {
                        clearTimeout(timer);
                    }
                };
                let out = await attempt();
                if (!out.definitive) out = await attempt();
                return out;
            }

            async confirmBooking() {
                // Single-submission discipline: the flag spans this ENTIRE
                // chain (quote gate, quiet refresh, session, envelope POST)
                // and is released in the finally below. handleBookingClick
                // refuses taps while it is set; the sanctioned requote
                // auto-resubmit releases it just before recursing.
                if (this._submitInFlight) return;
                this._submitInFlight = true;
                try {
                // PR 3C-2B2 — the quote is re-checked HERE, immediately before
                // submitting, not just when it was displayed. The passenger may
                // have sat on the vehicle screen past the 15-minute TTL, or
                // edited the trip in another tab. A stale quote must never be
                // submitted, and there is no fallback to the browser price.
                let serverQuoteContract = null;
                if (this.quoteFlowActive()) {
                    const snap = this._tapSnapshot;
                    // Submissions exist only downstream of a real tap.
                    if (!snap) { this.updateBookAvailability(); return; }
                    // Recheck AFTER the passenger modal: any intervening intent
                    // or vehicle change requires a new visible tap.
                    if (this.quoteKey(this.quoteIntent()) !== snap.intentKey ||
                        this.state.vehicle?.type !== snap.vehicleKey) {
                        this.notePriceChanged('Your ride changed — review it and tap again.');
                        return;
                    }
                    serverQuoteContract = this.captureServerQuoteContract();
                    if (!serverQuoteContract) {
                        const permanentFailure = this.state.quote.status === 'error' &&
                            this.state.quote.error?.retryable === false;
                        if (permanentFailure) {
                            this.renderQuoteState();
                            return;
                        }
                        // Quiet "Updating price…": ONE refresh for this tap,
                        // never an alert, never the word "refused".
                        const ok = await this.quietRefreshForTap(snap);
                        if (!ok) return;
                        serverQuoteContract = this.captureServerQuoteContract();
                        if (!serverQuoteContract) {
                            this.notePriceChanged('Price updated — review it and tap again.');
                            return;
                        }
                    }
                    // The accepted cents are the contract: a different number
                    // is shown, noted, and needs a new tap — never auto-sent.
                    if (serverQuoteContract.finalCents !== snap.finalCents) {
                        this.notePriceChanged('Price updated — review the new price and tap again.');
                        return;
                    }
                }

                // ========== PAYMENT CONFIGURATION ==========
                // Set to false to skip Stripe payment (driver collects cash/Zelle)
                // Set to true when ready to enable Stripe payments
                const REQUIRE_PAYMENT = false;
                // ============================================

                const editContext = this.pendingEdit ? { ...this.pendingEdit } : null;
                const isEditing = !!editContext;
                const tripId = isEditing
                    ? (editContext.tripCode || currentActiveBooking?.trip_id || '')
                    : this.generateTripId();

                // Get contact info from passenger modal
                const passengerModal = PassengerModal.getInstance();
                const contactInfo = passengerModal.getContactInfo();
                const passengerData = passengerModal.getPassengerData();

                // Freeze every mutable UI fact before the first await. A
                // session refresh may yield to carousel/navigation events; the
                // later POST must either use this one coherent snapshot or
                // refuse, never combine booking A with quote B.
                const submitState = {
                    mode: this.state.mode,
                    passengers: this.state.passengers,
                    pickupNotes: this.state.pickupNotes ? { ...this.state.pickupNotes } : {},
                    vehicle: this.state.vehicle ? { ...this.state.vehicle } : null,
                    dateTime: this.state.dateTime ? { ...this.state.dateTime } : {},
                    paymentMethod: this.state.paymentMethod,
                    promoCode: this.state.promoCode,
                    routeDuration: this.state.route?.duration ?? null,
                    addressLabel: this.state.locations.address?.address || '',
                    airportLabel: this.state.locations.airport?.name || ''
                };

                const bookingData = {
                    tripId: tripId,
                    booker: {
                        name: contactInfo?.name || 'Unknown',
                        phone: contactInfo?.phone || 'Not provided',
                        type: contactInfo?.type || 'booker'
                    },
                    passenger: {
                        name: passengerData?.type === 'guest'
                            ? passengerData.data.fullName
                            : contactInfo?.name || 'Self',
                        guestData: passengerData?.type === 'guest' ? passengerData.data : null,
                        count: submitState.passengers,
                        phone: passengerData?.type === 'guest'
                            ? `${passengerData.data.countryCode} ${passengerData.data.phone}`
                            : contactInfo?.phone || 'Not provided',
                        notes: submitState.pickupNotes
                    },
                    driver: {
                        name: "Carlos Martinez",
                        rating: 4.7,
                        vehicle: submitState.vehicle.name
                    },
                    route: {
                        from: submitState.mode === 'dropoff'
                            ? submitState.addressLabel
                            : submitState.airportLabel,
                        to: submitState.mode === 'dropoff'
                            ? submitState.airportLabel
                            : submitState.addressLabel
                    },
                    vehicle: submitState.vehicle,
                    dateTime: submitState.dateTime,
                    payment: {
                        method: submitState.paymentMethod,
                        promo: submitState.promoCode
                    },
                    pricing: (() => {
                        // PR 3C-2B2: when the server quote is authoritative the
                        // submitted total is the server's cents, full stop. The
                        // pricing.js chain below is the legacy path and applies
                        // only while the flag is off.
                        if (serverQuoteContract) {
                            const total = serverQuoteContract.finalCents / 100;
                            return { base: total, surge: 0, discount: 0, total };
                        }
                        const legacy = this.state.vehicle.pricing?.finalPrice
                            || this.state.route.price || this.state.vehicle.price;
                        return { base: legacy, surge: 0, discount: 0, total: legacy };
                    })(),
                    status: 'pending',
                    createdAt: new Date().toISOString()
                };
                
                // Calculate total amount
                const amount = bookingData.pricing.total;
                
                try {
                    // Show loading state
                    const bookBtn = document.getElementById('bookBtn');
                    const originalText = bookBtn.innerHTML;
                    bookBtn.innerHTML = '<span class="btn-main-text">Processing...</span>';
                    bookBtn.disabled = true;

                    // Fresh session FIRST — before any provisional storage or
                    // server write. Editing never cancels the existing ride;
                    // a failure therefore leaves the original row untouched.
                    const { data: { session: submitSession } } =
                        await window.supabaseClient.auth.getSession();
                    if (!submitSession) {
                        throw new Error('Your session expired — please sign in again to book.');
                    }
                    currentSession = submitSession;

                    if (REQUIRE_PAYMENT) {
                        // ===== STRIPE PAYMENT FLOW =====
                        // Get payment controller
                        const paymentController = PaymentModal.getInstance();
                        const selectedPayment = paymentController.getSelectedPayment();

                        if (!selectedPayment) {
                            alert('Please select a payment method first');
                            bookBtn.innerHTML = originalText;
                            bookBtn.disabled = false;
                            return;
                        }

                        // Process payment with Stripe
                        const paymentResult = await window.StripePayment.processPayment(
                            bookingData,
                            selectedPayment
                        );

                        if (!paymentResult.success) {
                            throw new Error(paymentResult.error || 'Payment failed');
                        }

                        // Payment successful
                        bookingData.status = 'confirmed';
                        bookingData.payment.transactionId = paymentResult.paymentIntentId;
                    } else {
                        // ===== SKIP PAYMENT - Collected by driver =====
                        bookingData.status = 'payment_pending';
                        bookingData.payment.method = 'cash';
                        bookingData.payment.note = 'Pay your driver by cash or Zelle';
                    }

                    // A new ride may use a provisional local record. An edit
                    // never overwrites local truth before the server commits:
                    // on any failure the original pending ride stays intact.
                    // (The old auto-cancel-and-recreate path lived here; it
                    // is deleted — editing updates the same row in place.)
                    if (!isEditing) {
                        localStorage.setItem(`trip_${tripId}`, JSON.stringify(bookingData));
                    }

                    // ===== PERSIST TO SUPABASE VIA API (REQUIRED) =====
                    // Bookings are authenticated-only and server-persisted:
                    // there is NO local fallback success. Only a real
                    // database booking ID may open the trip sheet — a failed
                    // server booking keeps the form intact and throws into
                    // the error handler below (which also removes the
                    // provisional trip_ record). submitSession was verified
                    // fresh above, before any side effect.

                    // customerName/phone = the traveling passenger (who the driver meets);
                    // bookerName/bookerPhone = who made the booking, when different
                    const apiPayload = {
                            customerName: bookingData.passenger?.name || bookingData.booker?.name || 'Guest',
                            phone: bookingData.passenger?.phone || bookingData.booker?.phone || '',
                            bookerName: bookingData.booker?.name || null,
                            bookerPhone: bookingData.booker?.phone || null,
                            email: bookingData.passenger?.guestData?.email || null,
                            pickup: bookingData.route.from,
                            dropoff: bookingData.route.to,
                            dateTime: bookingData.dateTime?.time || new Date().toISOString(),
                            vehicle: bookingData.vehicle?.name || 'Sedan',
                            price: bookingData.pricing?.total || 0,
                            mode: submitState.mode,
                            passengers: bookingData.passenger?.count || 1,
                            tripId: tripId,
                            bags: bookingData.vehicle?.bags || 0,
                            paymentMethod: bookingData.payment?.method || 'cash',
                            notes: bookingData.passenger?.notes?.chauffeurNotes || '',
                            pickupSign: bookingData.passenger?.notes?.pickupSign || null,
                            promoCode: bookingData.payment?.promo || null,
                            flightNumber: bookingData.passenger?.notes?.referenceCode || null,
                            durationMinutes: submitState.routeDuration,
                            refCode: getStoredRefCode()
                        };

                    // PR 3C-2B2 — carried now, ENFORCED in 2C. create-booking
                    // validates required fields only and ignores unknown ones,
                    // so sending these today needs no backend change and gives
                    // 2C a browser that already speaks the final contract.
                    // Canonical identity, vehicle key, and integer route facts
                    // are echoed from the server response. 2C recomputes the
                    // keyed commitment; autocomplete/browser-route values do
                    // not get to establish financial truth.
                    this.attachServerQuoteContract(apiPayload, serverQuoteContract);

                    if (isEditing) {
                        apiPayload.bookingId = editContext.bookingId;
                        apiPayload.expectedDetailsVersion = editContext.detailsVersion;
                    }

                    const submitUrl = isEditing
                        ? '/api/update-pending-booking'
                        : '/api/create-booking';

                    let response, result;
                    if (this.quoteFlowActive()) {
                        // THE ENVELOPE (plan v3.1 §1): operationId goes INSIDE
                        // the payload, then it is serialized exactly ONCE. A
                        // retry resends these exact bytes; a refreshed quote is
                        // a NEW payload and therefore a NEW operation.
                        apiPayload.operationId = (crypto.randomUUID && crypto.randomUUID()) ||
                            ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, c =>
                                (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
                        const envelope = {
                            operationId: apiPayload.operationId,
                            bodyString: JSON.stringify(apiPayload),
                            kind: isEditing ? 'edit' : 'create',
                            bookingId: isEditing ? editContext.bookingId : null,
                            authSubject: submitSession.user?.id || null,
                            createdAt: Date.now()
                        };
                        this.storePendingEnvelope(envelope);
                        const out = await this.submitEnvelope(
                            submitUrl, envelope.bodyString, submitSession.access_token);
                        if (!out.definitive) {
                            // UNKNOWN result after one exact retry: the envelope
                            // stays stored so "Check again" (and a same-tab
                            // reload) can recover the operation idempotently —
                            // an already-created ride is found, never duplicated.
                            bookBtn.innerHTML = originalText;
                            bookBtn.disabled = false;
                            this._pendingEnvelopeUnknown = true;
                            alert("We couldn't confirm the result — please use Check again. Nothing needs to be re-entered.");
                            this.offerPendingEnvelope(submitSession.user?.id || null);
                            return;
                        }
                        response = out.response;
                        result = out.result;
                        // Any definitive mapped response settles THIS envelope.
                        this.clearPendingEnvelope(envelope.operationId);
                    } else {
                        response = await fetch(submitUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${submitSession.access_token}`
                            },
                            body: JSON.stringify(apiPayload)
                        });
                        result = await response.json().catch(() => null);
                    }

                    // Old-client contract (fail-safe for EVERY mode): the
                    // server says this bundle is out of date — reload gets the
                    // current one. Distinct from requote, which is quote-lane.
                    if (response.status === 428 && result?.reload === true) {
                        alert('LinkMia has been updated — reloading to get the latest version.');
                        window.location.reload();
                        return;
                    }

                    // requote:true (quote expired/invalid/stale at the server):
                    // handled BEFORE any generic branch. Within this tap's
                    // budget (1 refresh + 1 auto-resubmit) the flow quietly
                    // refreshes and, if the accepted facts still reconcile,
                    // resubmits ONCE as a NEW envelope. Anything else returns
                    // to a visible tap. Never an alert, never "refused".
                    if (result?.requote === true && this.quoteFlowActive()) {
                        const snap = this._tapSnapshot;
                        bookBtn.innerHTML = originalText;
                        bookBtn.disabled = false;
                        if (snap && !snap.refreshUsed && !snap.resubmitUsed) {
                            snap.resubmitUsed = true;
                            const ok = await this.quietRefreshForTap(snap);
                            if (ok) {
                                // Sanctioned auto-resubmit: hand the flag to
                                // the recursive chain (its entry re-takes it
                                // synchronously — no tap can interleave).
                                this._submitInFlight = false;
                                return this.confirmBooking();
                            }
                            return;
                        }
                        this.invalidateQuote('server requested a fresh quote');
                        this.requestServerQuote({ force: true });
                        this.notePriceChanged('Please review the refreshed price and tap again.');
                        return;
                    }

                    if (response.status === 401) {
                        throw new Error('Your session expired — please sign in again to book.');
                    }
                    if (response.status === 403) {
                        throw new Error(isEditing
                            ? 'You do not have permission to edit this ride.'
                            : 'This account does not have a passenger profile. Please sign in with your passenger account or contact support.');
                    }
                    if (isEditing && response.status === 409) {
                        this.finishPendingEdit();
                        currentActiveBooking = {
                            ...(currentActiveBooking || {}),
                            id: editContext.bookingId,
                            trip_id: editContext.tripCode,
                            status: result?.currentStatus || currentActiveBooking?.status || 'pending',
                            details_version: result?.currentDetailsVersion || editContext.detailsVersion
                        };
                        bookBtn.innerHTML = originalText;
                        bookBtn.disabled = false;
                        alert('This ride changed while you were editing. Your changes were not applied.');
                        this.showTripSheet(editContext.bookingId);
                        return;
                    }
                    if (response.status === 409 && result?.existingBookingId) {
                        // Another tab/device already owns the account's live
                        // ride. Remove this provisional attempt and reopen the
                        // server-trusted booking instead of showing success or
                        // creating a duplicate.
                        try { localStorage.removeItem(`trip_${tripId}`); } catch (_) {}
                        localStorage.setItem('lm_last_trip_id', result.existingBookingId);
                        bookBtn.innerHTML = originalText;
                        bookBtn.disabled = false;
                        this.showTripSheet(result.existingBookingId);
                        return;
                    }
                    if (!response.ok || !result?.bookingId) {
                        console.error('❌ Booking API failed:', response.status, result);
                        throw new Error(isEditing
                            ? 'Changes not saved. Your original ride is unchanged. Please try again.'
                            : 'Booking could not be submitted — nothing was booked. Please try again.');
                    }

                    // Real database booking — the ONLY path to a success screen.
                    const supabaseBookingId = result.bookingId;
                    const storedBooking = isEditing
                        ? bookingData
                        : JSON.parse(localStorage.getItem(`trip_${tripId}`));
                    const savedTripId = result.tripId || tripId;
                    storedBooking.tripId = savedTripId;
                    storedBooking.supabaseId = result.bookingId;
                    storedBooking.supabaseSaved = true;
                    if (savedTripId) localStorage.setItem(`trip_${savedTripId}`, JSON.stringify(storedBooking));
                    localStorage.setItem('lm_last_trip_id', result.bookingId);
                    if (isEditing) {
                        currentActiveBooking = {
                            id: result.bookingId,
                            trip_id: result.tripId || tripId,
                            status: 'pending',
                            details_version: result.detailsVersion
                        };
                        this.finishPendingEdit();
