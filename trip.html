<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Your Trip - LinkMia</title>
    <style>
        :root {
            --bg: #1C1C1E;
            --panel-bg: #2C2C2E;
            --panel-bg-2: #262628;
            --text-primary: #FFFFFF;
            --text-secondary: #8E8E93;
            --text-light: #636366;
            --brand-grad: linear-gradient(135deg, #FF9933, #FF5733);
            --green: #32D74B;
            --orange: #FF5733;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .page { width: 100%; max-width: 540px; padding: 0 16px 26px; }

        /* Status strip: the page header */
        .status-strip {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            text-align: center;
            font-size: 14px; font-weight: 600; color: #FF9933;
            padding: 16px 2px 12px;
        }
        .status-strip.green { color: var(--green); }
        .status-strip.red { color: #FF453A; }
        .status-strip.gray { color: var(--text-secondary); }
        .pulse-dot {
            width: 9px; height: 9px; border-radius: 50%;
            background: #FF9933; flex-shrink: 0;
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }
        .status-sub {
            text-align: center; font-size: 12px; color: var(--text-secondary);
            margin: -6px 0 12px; padding: 0 8px; line-height: 1.5;
        }

        /* Progress steps */
        .steps {
            display: flex; padding: 12px 8px 10px;
            background: linear-gradient(135deg, var(--panel-bg) 0%, var(--panel-bg-2) 100%);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            margin-bottom: 12px;
        }
        .step { flex: 1; text-align: center; position: relative; }
        .step-dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: #48484A; margin: 0 auto 5px; position: relative; z-index: 1;
        }
        .step.done .step-dot { background: var(--green); }
        .step.current .step-dot {
            background: var(--orange);
            box-shadow: 0 0 0 4px rgba(255, 87, 51, 0.18);
        }
        .step-label { font-size: 10px; color: var(--text-light); }
        .step.done .step-label, .step.current .step-label { color: var(--text-primary); font-weight: 600; }
        .step::before {
            content: ''; position: absolute; top: 5px; left: -50%;
            width: 100%; height: 2px; background: #48484A;
        }
        .step:first-child::before { display: none; }
        .step.done::before, .step.current::before { background: var(--green); }

        /* Card */
        .card {
            background: linear-gradient(135deg, var(--panel-bg) 0%, var(--panel-bg-2) 100%);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            overflow: hidden;
            margin-bottom: 12px;
        }

        /* Vehicle — scales with the container width, keeps proportions */
        .vehicle-image-wrap {
            position: relative;
            aspect-ratio: 16 / 8.5;
            min-height: 170px;
            max-height: 280px;
            overflow: hidden;
            background: var(--panel-bg-2);
        }
        .vehicle-image-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .vehicle-image-wrap::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(28,28,30,0.85) 0%, transparent 45%);
        }
        .vehicle-overlay {
            position: absolute; bottom: 10px; left: 14px; right: 14px;
            display: flex; justify-content: space-between; align-items: flex-end; z-index: 1;
        }
        .vehicle-name { font-size: 17px; font-weight: 700; }
        .vehicle-capacity { font-size: 12px; color: #d8d8dc; margin-top: 2px; }
        .vehicle-price {
            background: var(--brand-grad);
            padding: 5px 13px; border-radius: 10px;
            font-size: 15px; font-weight: 800; color: white;
            box-shadow: 0 2px 10px rgba(255, 87, 51, 0.4);
        }

        /* Route timeline */
        .route { padding: 14px 16px 10px; }
        .route-row { display: flex; gap: 12px; }
        .route-rail { display: flex; flex-direction: column; align-items: center; }
        .route-marker {
            width: 24px; height: 24px; border-radius: 50%;
            background: var(--text-primary); color: var(--bg);
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 800; flex-shrink: 0;
        }
        .route-marker.b { background: var(--orange); color: white; }
        .route-rail-line { width: 2px; flex: 1; background: #48484A; margin: 3px 0; min-height: 18px; }
        .route-info { padding-bottom: 12px; flex: 1; min-width: 0; }
        .route-time { font-size: 14px; font-weight: 700; color: var(--green); }
        .route-time.eta { color: var(--text-secondary); }
        .route-time .eta-badge {
            font-size: 9px; font-weight: 700; color: var(--text-light);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 1px 6px; border-radius: 8px; margin-left: 5px;
            vertical-align: 2px; letter-spacing: 0.5px;
        }
        .route-addr { font-size: 13px; line-height: 1.35; margin-top: 2px; color: var(--text-primary); }
        .route-duration { font-size: 11px; color: var(--text-light); margin: -4px 0 8px 36px; }

        /* Flight reference (only when provided) */
        .flight-line {
            padding: 0 16px 14px;
            font-size: 13px; color: var(--text-secondary);
        }

        /* Buttons */
        .actions { display: flex; flex-direction: column; gap: 9px; }
        .btn {
            width: 100%; padding: 15px; border: none; border-radius: 13px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            transition: transform 0.15s ease;
            text-align: center; text-decoration: none; color: white; display: block;
            font-family: inherit;
        }
        .btn:active { transform: scale(0.98); }
        .btn-modify {
            background: var(--brand-grad);
            box-shadow: 0 4px 16px rgba(255, 87, 51, 0.35);
        }
        .btn-cancel {
            background: transparent;
            border: 1.5px solid rgba(255, 69, 58, 0.6);
            color: #FF453A;
            padding: 13px;
        }
        .btn-whatsapp {
            background: #25D366;
            box-shadow: 0 4px 16px rgba(37, 211, 102, 0.35);
        }
        .support { font-size: 12px; color: var(--text-light); text-align: center; margin-top: 14px; }
        .hidden { display: none !important; }
        .center-msg { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .center-msg a { color: var(--orange); font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="page">
        <div class="center-msg" id="loadingMsg">Loading your trip…</div>

        <div id="tripView" class="hidden">
            <div class="status-strip" id="statusStrip">
                <span class="pulse-dot" id="pulseDot"></span>
                <span id="statusText"></span>
            </div>
            <div class="status-sub" id="statusSub"></div>

            <div class="steps" id="steps">
                <div class="step" data-step="pending"><div class="step-dot"></div><div class="step-label">Requested</div></div>
                <div class="step" data-step="confirmed"><div class="step-dot"></div><div class="step-label">Confirmed</div></div>
                <div class="step" data-step="on_the_way"><div class="step-dot"></div><div class="step-label">On the way</div></div>
                <div class="step" data-step="arrived"><div class="step-dot"></div><div class="step-label">Arrived</div></div>
                <div class="step" data-step="completed"><div class="step-dot"></div><div class="step-label">Done</div></div>
            </div>

            <div class="card">
                <div class="vehicle-image-wrap" id="vehicleWrap">
                    <img id="vehicleImg" alt="">
                    <div class="vehicle-overlay">
                        <div>
                            <div class="vehicle-name" id="vehicleName"></div>
                            <div class="vehicle-capacity" id="vehicleCapacity"></div>
                        </div>
                        <div class="vehicle-price" id="tripPrice"></div>
                    </div>
                </div>

                <div class="route">
                    <div class="route-row">
                        <div class="route-rail">
                            <div class="route-marker">A</div>
                            <div class="route-rail-line"></div>
                        </div>
                        <div class="route-info">
                            <div class="route-time" id="pickupTime"></div>
                            <div class="route-addr" id="routeFrom"></div>
                        </div>
                    </div>
                    <div class="route-duration hidden" id="rideDuration"></div>
                    <div class="route-row">
                        <div class="route-rail">
                            <div class="route-marker b">B</div>
                        </div>
                        <div class="route-info" style="padding-bottom: 6px;">
                            <div class="route-time eta hidden" id="etaTime"></div>
                            <div class="route-addr" id="routeTo"></div>
                        </div>
                    </div>
                </div>

                <div class="flight-line hidden" id="flightLine"></div>
            </div>

            <div class="actions">
                <a class="btn btn-whatsapp hidden" id="waBtn" target="_blank" rel="noopener">💬 Message your driver on WhatsApp</a>
                <button class="btn btn-modify hidden" id="backBtn">← Go back</button>
                <button class="btn btn-cancel hidden" id="cancelBtn">Cancel booking</button>
                <a class="btn btn-modify hidden" id="rebookBtn" href="/" target="_top">🚗 Book another ride</a>
            </div>

            <div class="support" id="supportText"></div>
        </div>
    </div>

    <script>
        const SUPPORT_PHONE = '+1 (305) 509-3955';
        // MVP: single driver. Once driver accounts land, this comes from
        // the booking's assigned_driver record instead.
        const DRIVER = { name: 'Andres', phone: '13055093955' };
        const POLL_MS = 7000;
        const TERMINAL = ['completed', 'cancelled', 'declined'];
        const STEP_ORDER = ['pending', 'confirmed', 'on_the_way', 'arrived', 'completed'];

        // Vehicle catalog: image + capacity per database vehicle_type
        const VEHICLES = {
            sedan:    { img: '/images/luxury-sedan.jpg',        label: 'Tesla Model Y',      pax: 4,  bags: 4 },
            suv:      { img: '/images/premium-suv-escalade.jpg', label: 'Cadillac Escalade', pax: 7,  bags: 8 },
            escalade: { img: '/images/premium-suv-escalade.jpg', label: 'Cadillac Escalade', pax: 7,  bags: 8 },
            sprinter: { img: '/images/vip-sprinter.jpg',         label: 'Mercedes Sprinter', pax: 12, bags: 15 }
        };

        const STATUS_VIEW = {
            pending:     { color: '',      pulse: true,  text: 'Waiting for driver confirmation',
                           sub: 'We\'ve notified your driver — this usually takes just a few minutes.' },
            confirmed:   { color: 'green', pulse: false, text: '🎉 You\'ve been paired with your driver!',
                           sub: `${DRIVER.name} will pick you up as scheduled — say hello on WhatsApp; they'll share their live location when heading your way.` },
            on_the_way:  { color: 'green', pulse: true,  text: '🚗 Your driver is on the way',
                           sub: 'Please be ready at your pickup point.' },
            arrived:     { color: 'green', pulse: true,  text: '📍 Your driver has arrived',
                           sub: 'Please head to the pickup point.' },
            completed:   { color: 'green', pulse: false, text: '🎉 Trip complete',
                           sub: 'Thank you for riding with LinkMia!' },
            declined:    { color: 'red',   pulse: false, text: '😔 No driver available',
                           sub: `Sorry, no driver is available for this ride right now. Call or text us: ${SUPPORT_PHONE}` },
            cancelled:   { color: 'gray',  pulse: false, text: '🚫 Booking cancelled',
                           sub: 'This booking was cancelled.' },
            assigned:    { color: 'green', pulse: false, text: '✅ Driver assigned!', sub: '' },
            in_progress: { color: 'green', pulse: true,  text: '🚗 Trip in progress', sub: 'Enjoy your ride!' }
        };

        const params = new URLSearchParams(location.search);
        const bookingId = params.get('id') || localStorage.getItem('lm_last_trip_id');
        const isEmbedded = params.get('embed') === '1';
        let pollTimer = null;
        let readySignalSent = false;

        const $ = (id) => document.getElementById(id);

        // Embedded in the booking page's bottom sheet: the parent panel
        // provides the background and reveals the sheet once we're rendered,
        // so no loading text should ever flash.
        if (isEmbedded) {
            document.body.style.background = 'transparent';
            document.body.style.minHeight = '0';
            $('loadingMsg').textContent = '';
        }

        // Tell the parent sheet how tall the content is so the panel can
        // hug it instead of using a fixed height with dead space below.
        function reportHeight(type) {
            if (!isEmbedded) return;
            const page = document.querySelector('.page');
            const height = (page ? page.scrollHeight : document.body.scrollHeight) + 4;
            window.parent.postMessage({ type, height }, '*');
        }

        function fmtDayTime(iso) {
            if (!iso) return 'ASAP';
            const d = new Date(iso);
            const now = new Date();
            const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
            let day;
            if (d.toDateString() === now.toDateString()) day = 'Today';
            else if (d.toDateString() === tomorrow.toDateString()) day = 'Tomorrow';
            else day = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            return `${day} · ${time}`;
        }

        function fmtTime(d) {
            return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        }

        function showNoTrip() {
            $('loadingMsg').innerHTML = 'We couldn\'t find a booking to track.<br><br><a href="/" target="_top">Book a ride</a>';
        }

        function render(b) {
            $('loadingMsg').classList.add('hidden');
            $('tripView').classList.remove('hidden');

            const view = STATUS_VIEW[b.status] || { color: '', pulse: false, text: b.status, sub: '' };
            const strip = $('statusStrip');
            strip.className = 'status-strip ' + view.color;
            $('statusText').textContent = view.text;
            $('pulseDot').classList.toggle('hidden', !view.pulse);
            $('statusSub').textContent = view.sub;

            // Stepper (hidden for declined/cancelled)
            const showSteps = !['declined', 'cancelled'].includes(b.status);
            $('steps').classList.toggle('hidden', !showSteps);
            if (showSteps) {
                const idx = STEP_ORDER.indexOf(b.status);
                document.querySelectorAll('.step').forEach((el) => {
                    const sIdx = STEP_ORDER.indexOf(el.dataset.step);
                    el.classList.remove('done', 'current');
                    if (idx >= 0) {
                        if (b.status === 'completed' ? sIdx <= idx : sIdx < idx) el.classList.add('done');
                        else if (sIdx === idx) el.classList.add('current');
                    }
                });
            }

            // Vehicle
            const v = VEHICLES[b.vehicle_type] || VEHICLES.sedan;
            const img = $('vehicleImg');
            img.style.display = '';
            img.onerror = () => { img.style.display = 'none'; };
            if (img.getAttribute('src') !== v.img) img.src = v.img;
            $('vehicleName').textContent = b.vehicle_name || v.label;
            $('vehicleCapacity').innerHTML = `👥 Up to ${v.pax} &nbsp;·&nbsp; 🧳 Up to ${v.bags}`;
            $('tripPrice').textContent = '$' + (b.price || 0);

            // Route + times
            $('pickupTime').textContent = fmtDayTime(b.pickup_datetime);
            $('routeFrom').textContent = b.pickup_location || '—';
            $('routeTo').textContent = b.dropoff_location || '—';

            if (b.duration_minutes && b.pickup_datetime) {
                const eta = new Date(new Date(b.pickup_datetime).getTime() + b.duration_minutes * 60000);
                $('rideDuration').textContent = `⏱ ~${b.duration_minutes} min ride`;
                $('rideDuration').classList.remove('hidden');
                $('etaTime').innerHTML = `~${fmtTime(eta)} <span class="eta-badge">EST. ARRIVAL</span>`;
                $('etaTime').classList.remove('hidden');
            } else {
                $('rideDuration').classList.add('hidden');
                $('etaTime').classList.add('hidden');
            }

            // Flight reference, only when provided
            if (b.flight_number) {
                $('flightLine').textContent = `✈️ Flight ${b.flight_number}`;
                $('flightLine').classList.remove('hidden');
            } else {
                $('flightLine').classList.add('hidden');
            }

            // Actions
            const isPending = b.status === 'pending';
            $('backBtn').classList.toggle('hidden', !isPending);
            $('cancelBtn').classList.toggle('hidden', !isPending);
            $('rebookBtn').classList.toggle('hidden', !TERMINAL.includes(b.status));

            // Warm human channel once paired: WhatsApp chat with the driver
            const isActive = ['confirmed', 'on_the_way', 'arrived'].includes(b.status);
            const waBtn = $('waBtn');
            waBtn.classList.toggle('hidden', !isActive);
            if (isActive) {
                const hello = `Hi ${DRIVER.name}! This is ${b.customer_name || 'your passenger'} — trip ${b.trip_id || ''}.`;
                waBtn.href = `https://wa.me/${DRIVER.phone}?text=${encodeURIComponent(hello)}`;
                waBtn.textContent = `💬 Message ${DRIVER.name} on WhatsApp`;
            }

            $('supportText').textContent = `Trip ${b.trip_id || ''} · Questions? Call or text us: ${SUPPORT_PHONE}`;

            if (TERMINAL.includes(b.status) && pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }

            // Tell the parent page we're rendered so it can slide the sheet
            // up sized to the content; later renders re-report the height
            if (isEmbedded) {
                if (!readySignalSent) {
                    readySignalSent = true;
                    requestAnimationFrame(() => reportHeight('lm-ready'));
                } else {
                    requestAnimationFrame(() => reportHeight('lm-resize'));
                }
            }
        }

        async function fetchStatus() {
            try {
                const res = await fetch(`/api/booking-status?id=${encodeURIComponent(bookingId)}`);
                if (res.status === 404) {
                    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
                    showNoTrip();
                    return;
                }
                if (!res.ok) return; // transient — keep polling
                const { booking } = await res.json();
                render(booking);
            } catch (e) {
                console.warn('Status fetch failed:', e);
            }
        }

        async function cancelRequest() {
            const res = await fetch('/api/booking-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: bookingId, action: 'cancel' })
            });
            return res;
        }

        $('cancelBtn').addEventListener('click', async () => {
            if (!confirm('Cancel this booking?')) return;
            try {
                const res = await cancelRequest();
                if (res.status === 409) {
                    alert(`Your driver already accepted this ride — call us to change plans: ${SUPPORT_PHONE}`);
                }
                fetchStatus();
            } catch (e) {
                alert('Could not cancel right now. Please try again.');
            }
        });

        // Go back behaves exactly like the back arrow on the other modals:
        // just slides the sheet away. The request stays pending — if the
        // passenger rebooks, the booking page cancels this one automatically.
        $('backBtn').addEventListener('click', () => {
            if (isEmbedded) {
                window.parent.postMessage({ type: 'lm-close' }, '*');
            } else {
                window.location.href = '/';
            }
        });

        if (!bookingId) {
            showNoTrip();
        } else {
            fetchStatus();
            pollTimer = setInterval(fetchStatus, POLL_MS);
        }
    </script>
</body>
</html>
