# Netlify Configuration
# This file configures how Netlify builds and serves your site

[build]
  # Directory with serverless functions
  functions = "backend/functions"
  # Directory to publish (your site root)
  publish = "."

[dev]
  # Local development port
  port = 3001
  # Auto-open browser
  autoLaunch = false
  # Directory to serve
  publish = "."

# calculate-price retired (PR 3C-2C-B PR-1): it was a routed but uncalled
# client-distance-to-price oracle — the last spare pricing door. Explicit
# 404s on BOTH paths (the /admin pattern); the handler file is deleted, so
# the direct function path cannot serve even if routing regressed.
[[redirects]]
  from = "/api/calculate-price"
  to = "/admin-retired.html"
  status = 404

[[redirects]]
  from = "/.netlify/functions/calculate-price"
  to = "/admin-retired.html"
  status = 404

# Redirect API calls to functions (excluding maps which use proxy)

[[redirects]]
  from = "/api/create-booking"
  to = "/.netlify/functions/create-booking"
  status = 200

[[redirects]]
  from = "/api/update-pending-booking"
  to = "/.netlify/functions/update-pending-booking"
  status = 200

[[redirects]]
  from = "/api/create-payment-intent"
  to = "/.netlify/functions/create-payment-intent"
  status = 200

[[redirects]]
  from = "/api/confirm-payment"
  to = "/.netlify/functions/confirm-payment"
  status = 200

[[redirects]]
  from = "/api/track-flight"
  to = "/.netlify/functions/track-flight"
  status = 200

[[redirects]]
  from = "/api/booking-status"
  to = "/.netlify/functions/booking-status"
  status = 200

[[redirects]]
  from = "/api/cancel-booking"
  to = "/.netlify/functions/cancel-booking"
  status = 200

[[redirects]]
  from = "/api/driver-bookings"
  to = "/.netlify/functions/driver-bookings"
  status = 200

[[redirects]]
  from = "/api/update-booking-status"
  to = "/.netlify/functions/update-booking-status"
  status = 200

[[redirects]]
  from = "/api/release-booking"
  to = "/.netlify/functions/release-booking"
  status = 200

[[redirects]]
  from = "/api/quote-ride"
  to = "/.netlify/functions/quote-ride"
  status = 200

[[redirects]]
  from = "/api/profile"
  to = "/.netlify/functions/profile"
  status = 200

[[redirects]]
  from = "/api/driver-push-subscription"
  to = "/.netlify/functions/driver-push-subscription"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

# Driver dispatch page and passenger trip status page
[[redirects]]
  from = "/driver"
  to = "/driver.html"
  status = 200

[[redirects]]
  from = "/trip"
  to = "/trip.html"
  status = 200

# Legacy admin dashboard retired (Phase B RLS lockdown) — explicit 404s so
# the catch-all below can never serve the booking page at these paths.
# Netlify documents custom 404 responses; 410 is not a documented option.
[[redirects]]
  from = "/admin"
  to = "/admin-retired.html"
  status = 404

[[redirects]]
  from = "/admin.html"
  to = "/admin-retired.html"
  status = 404

# Redirect root to landing page
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Allow all static assets to be served directly
[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "/*.js"
  to = "/:splat.js"
  status = 200

# Catch-all redirect for SPA (only for paths without extensions)
[[redirects]]
  from = "/*"
  to = "/indexMVP.html"
  status = 200

# Headers for JavaScript files
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Environment variables (template - actual values in Netlify dashboard)
[build.environment]
  NODE_VERSION = "20"

# Function configuration
[functions]
  # Directory for functions (using backend/functions as defined in build section)
  # directory = "backend/functions"  # Commented out as it's already defined in [build]
  # Node bundler for functions
  node_bundler = "esbuild"

# Proactive readiness watchdog (PR 1) — Netlify Scheduled Function.
# Runs every 5 minutes on published production deploys only (deploy
# previews never run schedules; not exposed as a URL endpoint). Emergency
# stop: set WATCHDOG_DISABLED=1 in the Netlify env. Local invocation:
#   netlify functions:invoke notification-watchdog
[functions."notification-watchdog"]
  schedule = "*/5 * * * *"
