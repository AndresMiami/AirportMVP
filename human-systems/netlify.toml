# Netlify configuration for Human Systems Lens as its OWN Netlify site.
#
# Create a second Netlify site pointing at this same GitHub repository and
# set its BASE DIRECTORY to "human-systems". Netlify then reads this file
# instead of the repository-root netlify.toml (which belongs to LinkMia),
# installs dependencies here, and deploys only this app. Nothing from the
# LinkMia site (functions, redirects, env vars) is shared.
#
# See docs/DEPLOY-NETLIFY.md for the click-by-click steps.

[build]
  command = "npm run build"
  # Static export (next.config.ts sets output: "export"): plain HTML files.
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # vitest 4 + npm's peer resolver need this flag (same as local install)
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"

# The site is a static export: no Next runtime and no database. All
# notebook data lives in the visitor's browser (localStorage). Deep links
# work because every route is written as its own folder with an index.html
# (trailingSlash).
#
# ONE serverless function exists (Step 7A): netlify/functions/ai-task.ts,
# served at /api/ai-task. It is the only place the AI provider key lives
# (site environment variable ANTHROPIC_API_KEY, Functions scope; never in
# the build, never in the bundle). Without that variable the function
# answers "not configured" and the app keeps its offline demo; the browser
# selects the real provider only when the build variable
# NEXT_PUBLIC_AI_PROVIDER=remote is set. See docs/DEPLOY-NETLIFY.md.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
